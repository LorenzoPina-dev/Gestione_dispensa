events {}

http {
  # DNS embedded di Docker. Con `upstream { server host:port; }` nginx risolve il nome UNA SOLA VOLTA
  # all'avvio: se keycloak/gateway/web vengono ricreati (nuovo IP del container) nginx continua a puntare
  # al vecchio indirizzo e risponde 502 finché non viene riavviato. Con resolver + variabile nel proxy_pass
  # il nome viene ri-risolto a runtime (TTL 10s). Come effetto collaterale nginx parte anche se un upstream
  # opzionale (es. grafana) non è ancora attivo, invece di uscire con "host not found in upstream".
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Keycloak e i JWT generano cookie/header grandi: i default (8k) possono produrre 400/502.
  large_client_header_buffers 4 32k;

  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    set $web_upstream      http://web:80;
    set $gateway_upstream  http://gateway:3300;
    set $keycloak_upstream http://keycloak:8080;
    set $grafana_upstream  http://grafana:3000;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location /grafana/ {
      # Stesso comportamento di `proxy_pass http://grafana/;` (toglie il prefisso /grafana).
      rewrite ^/grafana/(.*)$ /$1 break;
      proxy_pass $grafana_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Prefix /grafana;
    }

    location /api/ {
      proxy_pass $gateway_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Connection "";
    }

    location /realms/ {
      proxy_pass $keycloak_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header Connection "";

      # Keycloak risponde con header grandi (Set-Cookie multipli, redirect con state/session_state):
      # oltre proxy_buffer_size (default 4k/8k) nginx logga "upstream sent too big header" e restituisce 502.
      proxy_buffer_size 128k;
      proxy_buffers 4 256k;
      proxy_busy_buffers_size 256k;
    }

    location / {
      proxy_pass $web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
