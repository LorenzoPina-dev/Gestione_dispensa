events {}
http {
  upstream web { server web:5173; }
  upstream gateway { server gateway:3000; }
  upstream keycloak { server keycloak:8080; }

  server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location /api/ { proxy_pass http://gateway; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Request-ID $request_id; }
    location /realms/ { proxy_pass http://keycloak; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location / { proxy_pass http://web; proxy_set_header Host $host; }
  }
}
