groups:
  - name: dispensa-services
    rules:
      - alert: ServiceDown
        expr: up{job=~"gateway|identity|users|families|products|barcode|vision|inventory|expiration|shopping|stores|offers|recipes|nutrition|notifications|media|search|analytics"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Dispensa service is down"
          description: "The scrape target {{ $labels.job }} has been unavailable for more than one minute."

      - alert: ServiceHigh5xxRate
        expr: |
          sum by (job) (rate(http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum by (job) (rate(http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate"
          description: "{{ $labels.job }} is returning more than 5% HTTP 5xx responses."

      - alert: ServiceHighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum by (job, le) (
              rate(http_request_duration_seconds_bucket[5m])
            )
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High service latency"
          description: "{{ $labels.job }} has a p95 HTTP latency above one second."

      - alert: KafkaConsumerLag
        expr: kafka_consumergroup_lag_sum > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high"
          description: "A Kafka consumer group has more than 1000 messages of lag."
