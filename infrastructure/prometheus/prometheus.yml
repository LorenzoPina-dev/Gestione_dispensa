  - job_name: vision
    metrics_path: /metrics
    static_configs:
      - targets: ["vision:3015"]
  - job_name: inventory
    metrics_path: /metrics
    static_configs:
      - targets: ["inventory:3016"]
  - job_name: expiration
    metrics_path: /metrics
    static_configs:
