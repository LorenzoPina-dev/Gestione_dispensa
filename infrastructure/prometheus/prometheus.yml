global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:3000"]
  - job_name: identity
    metrics_path: /metrics
    static_configs:
      - targets: ["identity:3010"]
