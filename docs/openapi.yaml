  /shelf-life/predictions/{predictionId}:
    get:
      operationId: getShelfLifePredictionsPredictionId
      tags: [Shelf-Life]
      parameters: [{$ref: '#/components/parameters/PredictionId'}]
      responses:
        '200': {description: Prediction, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /shelf-life/predictions/{predictionId}/apply:
    post:
      operationId: postShelfLifePredictionsPredictionIdApply
      tags: [Shelf-Life]
      parameters: [{$ref: '#/components/parameters/PredictionId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false}}}}
      responses:
        '200': {description: Applied, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /privacy/consents:
    get:
      operationId: getPrivacyConsents
      tags: [Privacy]
      responses:
        '200': {description: Consents, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
    put:
      operationId: putPrivacyConsents
      tags: [Privacy]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PrivacyConsents'}}}}
      responses:
        '200': {description: Consents, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /privacy/export:
    post:
      operationId: postPrivacyExport
      tags: [Privacy]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PrivacyExportRequest'}}}}
      responses:
        '202': {description: Export job, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /privacy/erase:
    post:
      operationId: postPrivacyErase
      tags: [Privacy]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EraseRequest'}}}}
      responses:
        '202': {description: Erasure job, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /internal/jobs:
    post:
      operationId: createInternalJob
      tags: [Jobs]
      security: [{internalServiceAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateJob'}
      responses:
        '202': {description: Job accepted, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /internal/jobs/{jobId}:
    get:
      operationId: getInternalJob
      tags: [Jobs]
      security: [{internalServiceAuth: []}]
      parameters: [{$ref: '#/components/parameters/JobId'}]
      responses:
        '200': {description: Job status, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /internal/shelf-life/predictions/{predictionId}/process:
    post:
      operationId: processShelfLifePrediction
      tags: [Shelf-Life]
      security: [{internalServiceAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/PredictionId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProcessShelfLifePrediction'}
      responses:
        '200': {description: Completed prediction, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/BusinessRuleViolation'}
  /views/dashboard-today:
    get:
      operationId: getDashboardTodayView
      tags: [Composite]
      parameters: [{$ref: '#/components/parameters/FamilyQuery'}]
      responses:
        '200': {description: Today view, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /views/pantry-screen:
    get:
      operationId: getPantryScreenView
      tags: [Composite]
      parameters: [{$ref: '#/components/parameters/FamilyQuery'}]
      responses:
        '200': {description: Pantry screen view, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /views/shopping-screen:
    get:
      operationId: getShoppingScreenView
      tags: [Composite]
      parameters: [{$ref: '#/components/parameters/FamilyQuery'}]
      responses:
        '200': {description: Shopping screen view, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /views/recipes-screen:
    get:
      operationId: getRecipesScreenView
      tags: [Composite]
      parameters: [{$ref: '#/components/parameters/FamilyQuery'}]
      responses:
        '200': {description: Recipes screen view, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /views/nutrition-screen:
    get:
      operationId: getNutritionScreenView
      tags: [Composite]
      parameters: [{$ref: '#/components/parameters/FamilyQuery'}]
      responses:
        '200': {description: Nutrition screen view, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /views/family-screen:
    get:
      operationId: getFamilyScreenView
      tags: [Composite]
      parameters: [{$ref: '#/components/parameters/FamilyQuery'}]
      responses:
        '200': {description: Family screen view, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /views/notifications-screen:
    get:
      operationId: getNotificationsScreenView
      tags: [Composite]
      parameters: [{$ref: '#/components/parameters/FamilyQuery'}]
      responses:
        '200': {description: Notifications screen view, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /client-errors:
    post:
      operationId: reportClientError
      tags: [Observability]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, message]
              properties:
                kind: {type: string, enum: [js_error, unhandled_rejection, react_render, api_error, network_error]}
                message: {type: string, minLength: 1, maxLength: 500}
                stack: {type: string, maxLength: 3000}
                page: {type: string, maxLength: 200}
                apiPath: {type: string, maxLength: 200}
                status: {type: integer, minimum: 100, maximum: 599}
                code: {type: string, maxLength: 64}
                requestId: {type: string, maxLength: 128}
                traceId: {type: string, maxLength: 128}
                appVersion: {type: string, maxLength: 32}
      responses:
        '204': {description: Accepted for telemetry}
        '400': {$ref: '#/components/responses/ValidationError'}
  /dashboard:
    get:
      operationId: getDashboard
      tags: [Composite]
      parameters: [{$ref: "#/components/parameters/FamilyQuery"}]
      responses:
        '200': {description: Dashboard, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardResponse'}}}}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
components:
  securitySchemes:
    internalServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: service-token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 512}}
    FamilyQuery: {name: familyId, in: query, schema: {$ref: '#/components/schemas/Uuid'}}
    FamilyId: {name: familyId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    InviteId: {name: inviteId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    Token: {name: token, in: path, required: true, schema: {type: string, minLength: 32, maxLength: 512}}
    ItemId: {name: itemId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    UserId: {name: userId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ProductId: {name: productId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ListId: {name: listId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ShoppingItemId: {name: itemId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    RecipeId: {name: recipeId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    StoreId: {name: storeId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    NotificationId: {name: notificationId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    JobId: {name: jobId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    DraftId: {name: draftId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    PredictionId: {name: predictionId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string}}
    IdempotencyKey: {name: X-Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 255}}
  schemas:
    Uuid: {type: string, format: uuid}
    DateTime: {type: string, format: date-time}
    DataResponse:
      type: object
      required: [data, version, meta]
      properties:
        data: {}
        version: {type: integer, minimum: 1}
        meta: {$ref: '#/components/schemas/Meta'}
      additionalProperties: false
    Meta:
      type: object
      required: [requestId, traceId, schemaVersion]
      additionalProperties: false
      properties:
        requestId: {$ref: '#/components/schemas/Uuid'}
        traceId: {type: string, minLength: 16, maxLength: 64}
        schemaVersion: {type: string, const: '1.0'}
    Error:
      type: object
      required: [error, meta]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, details, retryable, requestId]
          additionalProperties: false
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: array, items: {type: object}}
            retryable: {type: boolean}
            requestId: {$ref: '#/components/schemas/Uuid'}
        meta: {$ref: '#/components/schemas/Meta'}
    ProfilePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        displayName: {type: string, maxLength: 200}
        avatarUrl: {type: [string, 'null'], maxLength: 1000}
        locale: {type: string, maxLength: 16}
        timezone: {type: string, maxLength: 64}
    ProcessShelfLifePrediction:
      type: object
      required: [itemId, productId, storedAt, opened]
      additionalProperties: false
      properties:
        itemId: {$ref: '#/components/schemas/Uuid'}
        productId: {$ref: '#/components/schemas/Uuid'}
        storedAt: {type: string, enum: [pantry, fridge, freezer, cellar, other]}
        opened: {type: boolean}
        category: {type: [string, 'null'], maxLength: 120}
    JobListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [jobId, status, type, progress, draftId, error]
            additionalProperties: false
            properties:
              jobId: {$ref: '#/components/schemas/Uuid'}
              status: {type: string, enum: [queued, processing, completed, failed, cancelled, needs_review]}
              type: {type: string, enum: [receipt, pantry_image]}
              progress: {type: integer, minimum: 0, maximum: 100}
              draftId: {$ref: '#/components/schemas/Uuid'}
              error: {type: [string, 'null']}
        nextCursor: {type: [string, 'null']}
    CreateJob:
      type: object
      required: [type, payload, deduplicationKey]
      additionalProperties: false
      properties:
        type: {type: string, minLength: 1, maxLength: 100}
        payload: {type: object, additionalProperties: true}
        deduplicationKey: {type: string, minLength: 1, maxLength: 255}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        email: {type: string, format: email, maxLength: 320}
        password: {type: string, minLength: 8, maxLength: 200}
    RegisterResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [success, message]
          properties:
            success: {type: boolean}
            message: {type: string}
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 320}
    ResetPasswordResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accepted, message]
          properties:
            accepted: {type: boolean}
            message: {type: string}
    ProfileResponse:
      allOf:
        - {$ref: '#/components/schemas/DataResponse'}
    CreateFamily:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
    UpdateMemberRole:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: {type: string, enum: [admin, member]}
    CreatePrice:
      type: object
      required: [productId, amountMinor, currency, observedAt, source]
      additionalProperties: false
      properties:
        productId: {$ref: '#/components/schemas/Uuid'}
        amountMinor: {type: integer, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
    CreateInvite:
      type: object
      required: [role, expiresInSeconds]
      additionalProperties: false
      properties:
        email: {type: string, format: email}
        role: {type: string, enum: [member, admin, viewer]}
        expiresInSeconds: {type: integer, minimum: 3600, maximum: 604800}
    ResolveInviteRequest:
      type: object
      required: [token, browserBindingHash]
      additionalProperties: false
      properties:
        token: {type: string, minLength: 32, maxLength: 512}
        browserBindingHash: {type: string, pattern: '^[0-9a-fA-F]{16,128}
      type: object
      required: [productId, quantity, unit]
      additionalProperties: false
      properties:
        productId: {$ref: '#/components/schemas/Uuid'}
        quantity: {type: number, exclusiveMinimum: 0}
        unit: {type: string, maxLength: 16}
        expiresAt: {type: [string, 'null'], format: date-time}
        location: {type: [string, 'null'], maxLength: 32}
        lotCode: {type: [string, 'null'], maxLength: 100}
    PatchPantryItem:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        quantity: {type: number, exclusiveMinimum: 0}
        location: {type: [string, 'null'], maxLength: 32}
        expiresAt: {type: [string, 'null'], format: date-time}
        lotCode: {type: [string, 'null'], maxLength: 100}
    ConsumeRequest:
      type: object
      required: [quantity, reason]
      additionalProperties: false
      properties:
        quantity: {type: number, exclusiveMinimum: 0}
        reason: {type: string, enum: [used, expired, damaged, other]}
    WasteRequest:
      type: object
      required: [quantity, reason]
      additionalProperties: false
      properties:
        quantity: {type: number, exclusiveMinimum: 0}
        reason: {type: string, enum: [spoiled, expired, damaged, other]}
    CreateProduct:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 300}
        brand: {type: [string, 'null'], maxLength: 200}
        defaultUnit: {type: string, enum: [g, kg, ml, l, piece, pack], default: piece}
        category: {type: [string, 'null'], maxLength: 120}
        barcodes: {type: array, minItems: 1, items: {type: string, pattern: '^[0-9]{8,14}$'}}
        calories: {type: number, minimum: 0}
        protein: {type: number, minimum: 0}
        carbs: {type: number, minimum: 0}
        fat: {type: number, minimum: 0}
        fiber: {type: number, minimum: 0}
    PatchProduct:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 300}
        brand: {type: [string, 'null'], maxLength: 200}
        category: {type: [string, 'null'], maxLength: 120}
        imageObjectKey: {type: [string, 'null'], maxLength: 500}
        nutrition: {type: [object, 'null']}
    BarcodeRequest:
      type: object
      required: [barcode]
      additionalProperties: false
      properties:
        barcode: {type: string, pattern: '^[0-9]+$'}
    CreateShoppingList:
      type: object
      required: [familyId, name]
      additionalProperties: false
      properties:
        familyId: {$ref: '#/components/schemas/Uuid'}
        name: {type: string, minLength: 1, maxLength: 120}
    CreateShoppingItem:
      type: object
      required: [label, quantity, unit]
      additionalProperties: false
      properties:
        productId: {type: [string, 'null'], format: uuid}
        label: {type: string, minLength: 1, maxLength: 300}
        quantity: {type: number, exclusiveMinimum: 0}
        unit: {type: string, minLength: 1, maxLength: 16}
    PatchShoppingItem:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        label: {type: string, minLength: 1, maxLength: 300}
        quantity: {type: number, exclusiveMinimum: 0}
        unit: {type: string, minLength: 1, maxLength: 16}
        checked: {type: boolean}
    CreateRecipe:
      type: object
      required: [title, servings, ingredients, steps]
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        servings: {type: number, exclusiveMinimum: 0}
        ingredients: {type: array, items: {type: object, required: [name, quantity, unit], additionalProperties: false, properties: {productId: {type: [string, 'null'], format: uuid}, name: {type: string}, quantity: {type: number, exclusiveMinimum: 0}, unit: {type: string}}}}
        steps: {type: array, items: {type: string}}
    PatchRecipe:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title: {type: string, maxLength: 300}
        servings: {type: number, exclusiveMinimum: 0}
        ingredients: {type: array}
        steps: {type: array, items: {type: string}}
    NutritionTargets:
      type: object
      required: [caloriesKcal, proteinG, carbsG, fatG]
      additionalProperties: false
      properties:
        caloriesKcal: {type: number, minimum: 0}
        proteinG: {type: number, minimum: 0}
        carbsG: {type: number, minimum: 0}
        fatG: {type: number, minimum: 0}
    NutritionSummaryResponse:
