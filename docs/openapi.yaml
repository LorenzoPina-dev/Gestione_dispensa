openapi: 3.1.0
info:
  title: Gestione Dispensa Gateway API
  version: 2.0.0
servers:
  - url: /api
paths:
  /families:
    get:
      summary: List families
      responses:
        '200': {description: OK}
  /inventory:
    get:
      summary: Current pantry
      responses:
        '200': {description: OK}
  /shopping:
    get:
      summary: Shopping lists
      responses:
        '200': {description: OK}
  /catalog/barcodes/{barcode}:
    get:
      summary: Resolve barcode
      parameters:
        - {name: barcode, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Product}
        '404': {description: Not found}
