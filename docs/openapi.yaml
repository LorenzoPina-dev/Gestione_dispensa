      x-scope: owner
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/PrivacyExportRequest'}
      responses: {'202': {$ref: '#/components/responses/JobAccepted'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /privacy/erasure:
    post:
      tags: [Privacy]
      operationId: createPrivacyErasure
      summary: Create a privacy erasure request
      x-scope: owner
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/PrivacyErasureRequest'}
      responses: {'202': {$ref: '#/components/responses/JobAccepted'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /privacy/consents:
    get:
      tags: [Privacy]
      operationId: getPrivacyConsents
      summary: Get privacy consents
      x-scope: user
      responses: {'200': {$ref: '#/components/responses/PrivacyConsents'}}
  /privacy/consents/{purpose}:
    post:
      tags: [Privacy]
      operationId: updatePrivacyConsent
      summary: Update a privacy consent
      x-scope: user
      parameters: [{$ref: '#/components/parameters/Purpose'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/PrivacyConsentRequest'}
      responses: {'200': {$ref: '#/components/responses/PrivacyConsent'}}
  /admin/jobs/{jobId}:
    get:
      tags: [Admin]
      operationId: inspectJob
      summary: Inspect a job
      x-scope: operator
      parameters: [{$ref: '#/components/parameters/JobId'}]
      responses: {'200': {$ref: '#/components/responses/JobInspection'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /admin/jobs/{jobId}/replay:
    post:
      tags: [Admin]
      operationId: replayJob
      summary: Replay a job
      x-scope: operator
      parameters: [{$ref: '#/components/parameters/JobId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'202': {$ref: '#/components/responses/JobAccepted'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /admin/audit:
    get:
      tags: [Admin]
      operationId: searchAudit
      summary: Search audit events
      x-scope: operator
      responses: {'200': {$ref: '#/components/responses/AuditSearch'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /metrics:
    get:
      tags: [Platform]
      operationId: getMetrics
      summary: Get Prometheus metrics
      security: []
      x-scope: internal
      responses: {'200': {description: Prometheus metrics, content: {text/plain: {schema: {type: string}}}}}
  /health/live:
    get:
      tags: [Platform]
      operationId: getLiveness
      summary: Get liveness status
      security: []
      x-scope: internal
      responses: {'200': {$ref: '#/components/responses/Liveness'}}
  /health/ready:
    get:
      tags: [Platform]
      operationId: getReadiness
      summary: Get readiness status
      security: []
      x-scope: internal
      responses: {'200': {$ref: '#/components/responses/Readiness'}, '503': {$ref: '#/components/responses/DependencyUnavailable'}}
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://id.example.invalid/.well-known/openid-configuration
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
    FamilyId: {name: familyId, in: path, required: true, schema: {type: string, format: uuid}}
    JoinAttemptId: {name: joinAttemptId, in: path, required: true, schema: {type: string, format: uuid}}
    StockItemId: {name: stockItemId, in: path, required: true, schema: {type: string, format: uuid}}
    JobId: {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    MembershipId: {name: membershipId, in: path, required: true, schema: {type: string, format: uuid}}
    InviteId: {name: inviteId, in: path, required: true, schema: {type: string, format: uuid}}
    ProductId: {name: productId, in: path, required: true, schema: {type: string, format: uuid}}
    ConflictId: {name: conflictId, in: path, required: true, schema: {type: string, format: uuid}}
    ConsumptionId: {name: consumptionId, in: path, required: true, schema: {type: string, format: uuid}}
    ListId: {name: listId, in: path, required: true, schema: {type: string, format: uuid}}
    ItemId: {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}
    RecipeId: {name: recipeId, in: path, required: true, schema: {type: string, format: uuid}}
    OfferId: {name: offerId, in: path, required: true, schema: {type: string, format: uuid}}
    Purpose: {name: purpose, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 80}}
    Cursor: {name: cursor, in: query, required: false, schema: {type: string, maxLength: 512}}
    SearchQuery: {name: q, in: query, required: false, schema: {type: string, maxLength: 200}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
  requestBodies:
    UpdateMembershipRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/UpdateMembershipRequest'}}}
    CreateProductRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/CreateProductRequest'}}}
    UpdateProductRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/UpdateProductRequest'}}}
    ResolveBarcodeRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/ResolveBarcodeRequest'}}}
    CatalogImportRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/CatalogImportRequest'}}}
    ResolveCatalogConflictRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/ResolveCatalogConflictRequest'}}}
    MediaUploadIntentRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/MediaUploadIntentRequest'}}}
    CreateRecognitionJobRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/CreateRecognitionJobRequest'}}}
    ConfirmRecognitionRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/ConfirmRecognitionRequest'}}}
    UpdateStockItemRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/UpdateStockItemRequest'}}}
    EstimateConsumptionRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/EstimateConsumptionRequest'}}}
    CorrectConsumptionRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/CorrectConsumptionRequest'}}}
    CreateShoppingListRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/CreateShoppingListRequest'}}}
    AddShoppingItemRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/AddShoppingItemRequest'}}}
    UpdateShoppingItemRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/UpdateShoppingItemRequest'}}}
    CompleteShoppingItemRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/CompleteShoppingItemRequest'}}}
    LoadShoppingItemRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/LoadShoppingItemRequest'}}}
    ShoppingBatchActionRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/ShoppingBatchActionRequest'}}}
    CreateRecipeJobRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/CreateRecipeJobRequest'}}}
    PlanRecipeRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/PlanRecipeRequest'}}}
    ConfirmRecipeCookedRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/ConfirmRecipeCookedRequest'}}}
    OffersImportRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/OffersImportRequest'}}}
    NotificationPreferencesRequest:
