components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://id.example.invalid/.well-known/openid-configuration
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
    FamilyId: {name: familyId, in: path, required: true, schema: {type: string, format: uuid}}
    JoinAttemptId: {name: joinAttemptId, in: path, required: true, schema: {type: string, format: uuid}}
    StockItemId: {name: stockItemId, in: path, required: true, schema: {type: string, format: uuid}}
    JobId: {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    MembershipId: {name: membershipId, in: path, required: true, schema: {type: string, format: uuid}}
    InviteId: {name: inviteId, in: path, required: true, schema: {type: string, format: uuid}}
    ProductId: {name: productId, in: path, required: true, schema: {type: string, format: uuid}}
    ConflictId: {name: conflictId, in: path, required: true, schema: {type: string, format: uuid}}
    ConsumptionId: {name: consumptionId, in: path, required: true, schema: {type: string, format: uuid}}
    ListId: {name: listId, in: path, required: true, schema: {type: string, format: uuid}}
    ItemId: {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}
    RecipeId: {name: recipeId, in: path, required: true, schema: {type: string, format: uuid}}
    OfferId: {name: offerId, in: path, required: true, schema: {type: string, format: uuid}}
    Purpose: {name: purpose, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 80}}
    Cursor: {name: cursor, in: query, required: false, schema: {type: string, maxLength: 512}}
    SearchQuery: {name: q, in: query, required: false, schema: {type: string, maxLength: 200}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
  requestBodies:
    GenericRequest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/GenericRequest'}}}
  responses:
    Forbidden:
      description: Forbidden
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    NotFound:
      description: Not found or not visible to caller
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Conflict:
      description: Conflict or idempotency mismatch
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    ValidationError:
      description: Validation error
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    RateLimited:
      description: Rate limit exceeded
      headers: {Retry-After: {schema: {type: integer}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    GenericSuccess:
      description: Successful operation
      content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}
    JobAccepted:
      description: Job accepted for asynchronous processing
      content: {application/json: {schema: {$ref: '#/components/schemas/JobResponse'}}}
    CapabilityUnavailable:
      description: Optional capability is unavailable
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    ConsentRequired:
      description: Required consent is missing
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    QuotaExceeded:
      description: Request exceeds configured quota
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    DependencyUnavailable:
      description: Required dependency is unavailable
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  schemas:
    Meta:
      type: object
      required: [requestId, traceId, schemaVersion]
      properties:
        requestId: {type: string, format: uuid}
        traceId: {type: string}
        schemaVersion: {type: string}
    CreateFamilyRequest:
      type: object
      required: [displayName, locale, timezone, unitSystem]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 120}
        locale: {type: string, example: it-IT}
        timezone: {type: string, example: Europe/Rome}
        unitSystem: {type: string, enum: [METRIC, IMPERIAL]}
    FamilyResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: object, required: [familyId, membershipId, role, redirect], properties: {familyId: {type: string, format: uuid}, membershipId: {type: string, format: uuid}, role: {type: string, enum: [CREATOR]}, redirect: {type: string}}}
        meta: {$ref: '#/components/schemas/Meta'}
    CreateInviteRequest:
      type: object
      required: [role, expiresInSeconds]
      properties:
        role: {type: string, enum: [ADMIN, MEMBER, VIEWER]}
        expiresInSeconds: {type: integer, minimum: 60, maximum: 86400}
        replaceActiveInvite: {type: boolean, default: false}
    InviteCreatedResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: object, required: [inviteId, role, status, expiresAt, qrPayload, fallbackCode], properties: {inviteId: {type: string, format: uuid}, role: {type: string}, status: {type: string, enum: [CREATED]}, expiresAt: {type: string, format: date-time}, qrPayload: {type: string, writeOnly: true}, fallbackCode: {type: string, writeOnly: true}}}
        meta: {$ref: '#/components/schemas/Meta'}
    ResolveInviteRequest:
      type: object
      required: [token, clientNonce]
      properties: {token: {type: string, minLength: 32}, clientNonce: {type: string, format: uuid}}
    JoinAttemptResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: object, required: [joinAttemptId, status, expiresAt], properties: {joinAttemptId: {type: string, format: uuid}, status: {type: string, enum: [PENDING_AUTHENTICATION, PENDING_REVIEW, UNAVAILABLE]}, expiresAt: {type: string, format: date-time}}}
        meta: {$ref: '#/components/schemas/Meta'}
    InviteReviewResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: object, required: [familyPreview, proposedRole, expiresAt], properties: {familyPreview: {type: object, properties: {displayName: {type: string}}}, proposedRole: {type: string}, expiresAt: {type: string, format: date-time}, requiresConsent: {type: boolean}}}
        meta: {$ref: '#/components/schemas/Meta'}
    AcceptInviteRequest:
      type: object
      required: [accepted, consentVersion]
      properties: {accepted: {type: boolean, const: true}, consentVersion: {type: string}}
    MembershipResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: object, required: [familyId, membershipId, role, status, redirect], properties: {familyId: {type: string, format: uuid}, membershipId: {type: string, format: uuid}, role: {type: string}, status: {type: string, enum: [ACTIVE]}, redirect: {type: string}}}
        meta: {$ref: '#/components/schemas/Meta'}
    ActiveFamilyResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: object, required: [familyId], properties: {familyId: {type: string, format: uuid}}}
        meta: {$ref: '#/components/schemas/Meta'}
    CreateStockItemRequest:
      type: object
      required: [productId, quantity, unit]
      properties: {productId: {type: string, format: uuid}, quantity: {type: number, exclusiveMinimum: 0}, unit: {type: string, enum: [g, kg, ml, l, piece, pack]}, expiresAt: {type: [string, 'null'], format: date-time}, reorderPoint: {type: [number, 'null'], minimum: 0}, locationId: {type: [string, 'null'], format: uuid}}
    MovementRequest:
      type: object
      required: [kind, quantity, unit, clientOperationId]
      properties: {kind: {type: string, enum: [RECEIPT, CONSUMPTION, WASTE, ADJUSTMENT, TRANSFER]}, quantity: {type: number, exclusiveMinimum: 0}, unit: {type: string}, reason: {type: [string, 'null'], maxLength: 500}, occurredAt: {type: string, format: date-time}, clientOperationId: {type: string, format: uuid}}
    StockItemResponse:
      type: object
      required: [data, meta]
      properties: {data: {type: object, properties: {stockItemId: {type: string, format: uuid}, familyId: {type: string, format: uuid}, productId: {type: string, format: uuid}, quantity: {type: number}, unit: {type: string}, version: {type: integer}, updatedAt: {type: string, format: date-time}}}, meta: {$ref: '#/components/schemas/Meta'}}
    ShoppingListResponse:
      type: object
      required: [data, meta]
      properties: {data: {type: object, properties: {listId: {type: string, format: uuid}, familyId: {type: string, format: uuid}, items: {type: array, items: {type: object}}}}, meta: {$ref: '#/components/schemas/Meta'}}
    JobResponse:
      type: object
      required: [data, meta]
      properties: {data: {type: object, required: [jobId, status], properties: {jobId: {type: string, format: uuid}, status: {type: string, enum: [PENDING, PROCESSING, PENDING_REVIEW, COMPLETED, FAILED, CANCELLED, DEGRADED]}, retryable: {type: boolean}, traceId: {type: string}, error: {type: [object, 'null']}}}, meta: {$ref: '#/components/schemas/Meta'}}
    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error: {type: object, required: [code, message, retryable], properties: {code: {type: string}, message: {type: string}, retryable: {type: boolean}, details: {type: array, items: {type: object}}}}
        meta: {$ref: '#/components/schemas/Meta'}
    GenericRequest:
      type: object
      additionalProperties: true
      description: Operation-specific request body defined by the owning service contract.
    GenericResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: object, additionalProperties: true}
        meta: {$ref: '#/components/schemas/Meta'}
