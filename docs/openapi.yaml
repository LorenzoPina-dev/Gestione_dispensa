      responses:
        '200': {description: Confirmed, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /shelf-life/predictions:
    post:
      operationId: postShelfLifePredictions
      tags: [Shelf-Life]
