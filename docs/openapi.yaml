      content: {application/json: {schema: {$ref: '#/components/schemas/ExpiryListResponse'}}}
    ConsumptionCorrection:
      description: Corrected consumption
      content: {application/json: {schema: {$ref: '#/components/schemas/ConsumptionCorrectionResponse'}}}
    ShoppingListCollection:
      description: Shopping list collection
      content: {application/json: {schema: {$ref: '#/components/schemas/ShoppingListCollectionResponse'}}}
    ShoppingList:
      description: Shopping list
      content: {application/json: {schema: {$ref: '#/components/schemas/ShoppingListResponse'}}}
    ShoppingItem:
      description: Shopping item
      content: {application/json: {schema: {$ref: '#/components/schemas/ShoppingItemResponse'}}}
    InventoryLoad:
      description: Confirmed inventory load
      content: {application/json: {schema: {$ref: '#/components/schemas/InventoryLoadResponse'}}}
    ShoppingBatchAction:
      description: Batch action result
      content: {application/json: {schema: {$ref: '#/components/schemas/ShoppingBatchActionResponse'}}}
    ShoppingListArchived:
      description: Archived shopping list
      content: {application/json: {schema: {$ref: '#/components/schemas/ShoppingListResponse'}}}
    RecipeSuggestionList:
      description: Recipe suggestions
      content: {application/json: {schema: {$ref: '#/components/schemas/RecipeSuggestionListResponse'}}}
    Recipe:
      description: Recipe detail
      content: {application/json: {schema: {$ref: '#/components/schemas/RecipeResponse'}}}
    RecipePlan:
      description: Planned recipe
      content: {application/json: {schema: {$ref: '#/components/schemas/RecipePlanResponse'}}}
    ShoppingAdditions:
      description: Missing recipe ingredients added to shopping
      content: {application/json: {schema: {$ref: '#/components/schemas/ShoppingAdditionsResponse'}}}
    RecipeCooked:
      description: Confirmed recipe consumption
      content: {application/json: {schema: {$ref: '#/components/schemas/RecipeCookedResponse'}}}
    NutritionSummary:
      description: Nutrition summary
      content: {application/json: {schema: {$ref: '#/components/schemas/NutritionSummaryResponse'}}}
    ProductNutrition:
      description: Product nutrition profile
      content: {application/json: {schema: {$ref: '#/components/schemas/ProductNutritionResponse'}}}
    OfferList:
      description: Fresh authorized offers
      content: {application/json: {schema: {$ref: '#/components/schemas/OfferListResponse'}}}
    Offer:
      description: Offer detail
      content: {application/json: {schema: {$ref: '#/components/schemas/OfferResponse'}}}
    NotificationList:
      description: User notifications
      content: {application/json: {schema: {$ref: '#/components/schemas/NotificationListResponse'}}}
    NotificationPreferences:
      description: Updated notification preferences
      content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreferencesResponse'}}}
    JobInspection:
      description: Operator job inspection
      content: {application/json: {schema: {$ref: '#/components/schemas/JobInspectionResponse'}}}
    AuditSearch:
      description: Filtered audit events
      content: {application/json: {schema: {$ref: '#/components/schemas/AuditSearchResponse'}}}
    Liveness:
      description: Liveness status
      content: {application/json: {schema: {$ref: '#/components/schemas/LivenessResponse'}}}
    Readiness:
      description: Dependency readiness status
      content: {application/json: {schema: {$ref: '#/components/schemas/ReadinessResponse'}}}
  schemas:
    Meta:
      type: object
      required: [requestId, traceId, schemaVersion]
      properties:
        requestId: {type: string, format: uuid}
        traceId: {type: string}
        schemaVersion: {type: string}
    UpdateMembershipRequest:
      type: object
      additionalProperties: false
      required: [role, status]
      properties:
        role: {type: string, enum: [ADMIN, MEMBER, VIEWER]}
        status: {type: string, enum: [ACTIVE, SUSPENDED]}
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name, defaultUnit]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        brand: {type: [string, 'null'], maxLength: 120}
        defaultUnit: {type: string, enum: [g, kg, ml, l, piece, pack]}
        identifiers: {type: array, items: {type: object, required: [type, value], properties: {type: {type: string}, value: {type: string}}}}
    UpdateProductRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        brand: {type: [string, 'null'], maxLength: 120}
        defaultUnit: {type: string, enum: [g, kg, ml, l, piece, pack]}
    ResolveBarcodeRequest:
      type: object
      additionalProperties: false
      required: [barcode]
      properties: {barcode: {type: string, minLength: 8, maxLength: 18}}
    CatalogImportRequest:
      type: object
      additionalProperties: false
      required: [sourceId, identifiers]
      properties:
        sourceId: {type: string, format: uuid}
        identifiers: {type: array, minItems: 1, items: {type: string}}
    ResolveCatalogConflictRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties: {decision: {type: string, enum: [ACCEPT_EXTERNAL, KEEP_MANUAL, MERGE]}}
    MediaUploadIntentRequest:
      type: object
      additionalProperties: false
      required: [contentType, sizeBytes, checksum]
      properties:
        contentType: {type: string}
        sizeBytes: {type: integer, minimum: 1}
        checksum: {type: string, minLength: 16}
    CreateRecognitionJobRequest:
      type: object
      additionalProperties: false
      required: [mediaId]
      properties: {mediaId: {type: string, format: uuid}}
    ConfirmRecognitionRequest:
      type: object
      additionalProperties: false
      required: [candidateIds]
      properties: {candidateIds: {type: array, items: {type: string}, minItems: 1}}
    UpdateStockItemRequest:
      type: object
      additionalProperties: false
      properties:
        reorderPoint: {type: [number, 'null'], minimum: 0}
        locationId: {type: [string, 'null'], format: uuid}
        expiresAt: {type: [string, 'null'], format: date-time}
    EstimateConsumptionRequest:
      type: object
      additionalProperties: false
      required: [source]
      properties: {source: {type: string, enum: [RECIPE, DIARY]}, referenceId: {type: [string, 'null'], format: uuid}}
    CorrectConsumptionRequest:
      type: object
      additionalProperties: false
      required: [quantity, unit]
      properties: {quantity: {type: number, exclusiveMinimum: 0}, unit: {type: string}, reason: {type: string, minLength: 1, maxLength: 500}}
    CreateShoppingListRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties: {name: {type: string, minLength: 1, maxLength: 120}}
    AddShoppingItemRequest:
      type: object
      additionalProperties: false
      required: [displayName, quantity, unit]
      properties:
        productId: {type: [string, 'null'], format: uuid}
        displayName: {type: string, minLength: 1, maxLength: 200}
        quantity: {type: number, exclusiveMinimum: 0}
        unit: {type: string}
    UpdateShoppingItemRequest:
      type: object
      additionalProperties: false
      properties:
        quantity: {type: number, exclusiveMinimum: 0}
        state: {type: string, enum: [PROPOSED, ACCEPTED, SNOOZED, IGNORED, COMPLETED]}
    CompleteShoppingItemRequest:
      type: object
      additionalProperties: false
      required: [completedQuantity]
      properties: {completedQuantity: {type: number, exclusiveMinimum: 0}}
    LoadShoppingItemRequest:
      type: object
      additionalProperties: false
      required: [quantity, unit]
      properties: {quantity: {type: number, exclusiveMinimum: 0}, unit: {type: string}, locationId: {type: [string, 'null'], format: uuid}}
    ShoppingBatchActionRequest:
      type: object
      additionalProperties: false
      required: [itemIds, action]
      properties:
        itemIds: {type: array, minItems: 1, items: {type: string, format: uuid}}
        action: {type: string, enum: [ACCEPT, REJECT, SNOOZE, COMPLETE]}
    CreateRecipeJobRequest:
      type: object
      additionalProperties: false
      required: [consentVersion]
      properties: {consentVersion: {type: string, minLength: 1}}
    PlanRecipeRequest:
      type: object
      additionalProperties: false
      required: [servings]
      properties: {servings: {type: number, exclusiveMinimum: 0}}
    ConfirmRecipeCookedRequest:
      type: object
      additionalProperties: false
      required: [servings]
      properties: {servings: {type: number, exclusiveMinimum: 0}}
    OffersImportRequest:
      type: object
      additionalProperties: false
      required: [sourceId, areaCode]
      properties: {sourceId: {type: string, format: uuid}, areaCode: {type: string, minLength: 1}}
    NotificationPreferencesRequest:
      type: object
      additionalProperties: false
      required: [enabledCategories, quietHours]
      properties:
        enabledCategories: {type: array, items: {type: string}}
        quietHours: {type: object, required: [from, to], properties: {from: {type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$'}, to: {type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$'}}}
    CreateFamilyRequest:
      type: object
      required: [displayName, locale, timezone, unitSystem]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 120}
        locale: {type: string, example: it-IT}
        timezone: {type: string, example: Europe/Rome}
        unitSystem: {type: string, enum: [METRIC, IMPERIAL]}
    FamilyResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: object, required: [familyId, membershipId, role, redirect], properties: {familyId: {type: string, format: uuid}, membershipId: {type: string, format: uuid}, role: {type: string, enum: [CREATOR]}, redirect: {type: string}}}
        meta: {$ref: '#/components/schemas/Meta'}
    CreateInviteRequest:
      type: object
      required: [role, expiresInSeconds]
      properties:
        role: {type: string, enum: [ADMIN, MEMBER, VIEWER]}
        expiresInSeconds: {type: integer, minimum: 60, maximum: 86400}
        replaceActiveInvite: {type: boolean, default: false}
    InviteCreatedResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: object, required: [inviteId, role, status, expiresAt, qrPayload, fallbackCode], properties: {inviteId: {type: string, format: uuid}, role: {type: string}, status: {type: string, enum: [CREATED]}, expiresAt: {type: string, format: date-time}, qrPayload: {type: string, writeOnly: true}, fallbackCode: {type: string, writeOnly: true}}}
        meta: {$ref: '#/components/schemas/Meta'}
    ResolveInviteRequest:
      type: object
      required: [token, clientNonce]
      properties: {token: {type: string, minLength: 32}, clientNonce: {type: string, format: uuid}}
    JoinAttemptResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: object, required: [joinAttemptId, status, expiresAt], properties: {joinAttemptId: {type: string, format: uuid}, status: {type: string, enum: [PENDING_AUTHENTICATION, PENDING_REVIEW, UNAVAILABLE]}, expiresAt: {type: string, format: date-time}}}
        meta: {$ref: '#/components/schemas/Meta'}
    InviteReviewResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: object, required: [familyPreview, proposedRole, expiresAt], properties: {familyPreview: {type: object, properties: {displayName: {type: string}}}, proposedRole: {type: string}, expiresAt: {type: string, format: date-time}, requiresConsent: {type: boolean}}}
        meta: {$ref: '#/components/schemas/Meta'}
    AcceptInviteRequest:
      type: object
      required: [accepted, consentVersion]
      properties: {accepted: {type: boolean, const: true}, consentVersion: {type: string}}
    MembershipResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: object, required: [familyId, membershipId, role, status, redirect], properties: {familyId: {type: string, format: uuid}, membershipId: {type: string, format: uuid}, role: {type: string}, status: {type: string, enum: [ACTIVE]}, redirect: {type: string}}}
        meta: {$ref: '#/components/schemas/Meta'}
    ActiveFamilyResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: object, required: [familyId], properties: {familyId: {type: string, format: uuid}}}
        meta: {$ref: '#/components/schemas/Meta'}
    CreateStockItemRequest:
