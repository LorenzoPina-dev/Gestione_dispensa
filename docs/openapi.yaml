openapi: 3.1.0
info:
  title: Dispensa API
  version: 1.0.0
  description: Versioned public contract for family, inventory and shopping flows.
  license: {name: Internal engineering contract}
servers:
  - url: https://api.example.invalid/api/v1
security:
  - oidc: []
tags:
  - {name: Identity, description: "Authenticated principal and identity context"}
  - {name: Families, description: "Family membership and active-family context"}
  - {name: Invites, description: "Secure family invitation lifecycle"}
  - {name: Catalog, description: "Canonical products and provenance"}
  - {name: Recognition, description: "Media and reviewable recognition jobs"}
  - {name: Inventory, description: "Stock items, movements, expiry and consumption"}
  - {name: Shopping, description: "Shared lists and reorder suggestions"}
  - {name: Recipes, description: "Recipe suggestions and planning"}
  - {name: Nutrition, description: "Source-qualified nutrition summaries"}
  - {name: Offers, description: "Authorized retailer offer data"}
  - {name: Notifications, description: "User notifications and preferences"}
  - {name: Privacy, description: "Export, erasure and consent controls"}
  - {name: Admin, description: "Restricted operations and audit access"}
  - {name: Jobs, description: "Asynchronous job status"}
  - {name: Platform, description: "Internal health and telemetry endpoints"}
paths:
  /families:
    get:
      tags: [Families]
      operationId: listFamilies
      summary: List families
      x-scope: authenticated
      responses: {'200': {$ref: '#/components/responses/FamilyList'}}
    post:
      tags: [Families]
      operationId: createFamily
      summary: Create a family
      security: [{oidc: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFamilyRequest'}
      responses:
        '201':
          description: Family created
          content: {application/json: {schema: {$ref: '#/components/schemas/FamilyResponse'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /families/{familyId}/invites:
    get:
      tags: [Invites]
      operationId: listFamilyInvites
      summary: List family invites
      x-scope: family.admin
      parameters: [{$ref: '#/components/parameters/FamilyId'}]
      responses: {'200': {$ref: '#/components/responses/InviteList'}, '403': {$ref: '#/components/responses/Forbidden'}}
    post:
      tags: [Invites]
      operationId: createFamilyInvite
      summary: Create a family invite
      parameters:
        - {$ref: '#/components/parameters/FamilyId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateInviteRequest'}}}
      responses:
        '201':
          description: One-time invite created. Raw QR payload is returned only here.
          content: {application/json: {schema: {$ref: '#/components/schemas/InviteCreatedResponse'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /family-invites/resolve:
    post:
      tags: [Invites]
      operationId: resolveFamilyInvite
      summary: Resolve a family invite
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResolveInviteRequest'}}}
      responses:
        '200':
          description: Generic result; invalid tokens must not reveal details.
          content: {application/json: {schema: {$ref: '#/components/schemas/JoinAttemptResponse'}}}
        '429': {$ref: '#/components/responses/RateLimited'}
  /family-invites/{joinAttemptId}/review:
    get:
      tags: [Invites]
      operationId: reviewFamilyInvite
      summary: Review a family invite
      parameters: [{$ref: '#/components/parameters/JoinAttemptId'}]
      responses:
        '200':
          description: Limited preview after authorization/context validation.
          content: {application/json: {schema: {$ref: '#/components/schemas/InviteReviewResponse'}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /family-invites/{joinAttemptId}/accept:
    post:
      tags: [Invites]
      operationId: acceptFamilyInvite
      summary: Accept a family invite
      parameters:
        - {$ref: '#/components/parameters/JoinAttemptId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AcceptInviteRequest'}}}
      responses:
        '200':
          description: Idempotent membership result.
          content: {application/json: {schema: {$ref: '#/components/schemas/MembershipResponse'}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /families/{familyId}/activate:
    post:
      tags: [Families]
      operationId: activateFamily
      summary: Activate a family
      parameters: [{$ref: '#/components/parameters/FamilyId'}]
      responses:
        '200':
          description: Active family changed.
          content: {application/json: {schema: {$ref: '#/components/schemas/ActiveFamilyResponse'}}}
  /inventory/items:
    post:
      tags: [Inventory]
      operationId: createStockItem
      summary: Create a stock item
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateStockItemRequest'}}}
      responses:
        '201':
          description: Stock item created.
          content: {application/json: {schema: {$ref: '#/components/schemas/StockItemResponse'}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /inventory/items/{stockItemId}/movements:
    get:
      tags: [Inventory]
      operationId: listStockMovements
      summary: List stock movements
      x-scope: inventory.read
      parameters: [{$ref: '#/components/parameters/StockItemId'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {$ref: '#/components/responses/StockMovementList'}}
    post:
      tags: [Inventory]
      operationId: recordStockMovement
      summary: Record a stock movement
      parameters:
        - {$ref: '#/components/parameters/StockItemId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MovementRequest'}}}
      responses:
        '201':
          description: Immutable movement applied.
          content: {application/json: {schema: {$ref: '#/components/schemas/StockItemResponse'}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /shopping-lists/active:
    get:
      tags: [Shopping]
      operationId: getActiveShoppingList
      summary: Get the active shopping list
      responses:
        '200':
          description: Active list for active family.
          content: {application/json: {schema: {$ref: '#/components/schemas/ShoppingListResponse'}}}
  /jobs/{jobId}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get a job
      parameters: [{$ref: '#/components/parameters/JobId'}]
      responses:
        '200':
          description: Authorized job status.
          content: {application/json: {schema: {$ref: '#/components/schemas/JobResponse'}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /me:
    get:
      tags: [Identity]
      operationId: getCurrentPrincipal
      summary: Get the current principal
      x-scope: authenticated
      responses: {'200': {$ref: '#/components/responses/Principal'}}
  /families/{familyId}:
    get:
      tags: [Families]
      operationId: getFamily
      summary: Get a family
      x-scope: family.read
      parameters: [{$ref: '#/components/parameters/FamilyId'}]
      responses: {'200': {$ref: '#/components/responses/Family'}, '404': {$ref: '#/components/responses/NotFound'}}
  /families/{familyId}/members:
    get:
      tags: [Families]
      operationId: listFamilyMembers
      summary: List family members
      x-scope: family.read
      parameters: [{$ref: '#/components/parameters/FamilyId'}]
      responses: {'200': {$ref: '#/components/responses/MembershipList'}, '404': {$ref: '#/components/responses/NotFound'}}
  /families/{familyId}/members/{membershipId}:
    patch:
      tags: [Families]
      operationId: updateFamilyMembership
      summary: Update a family membership
      x-scope: family.admin
      parameters: [{$ref: '#/components/parameters/FamilyId'}, {$ref: '#/components/parameters/MembershipId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/UpdateMembershipRequest'}
      responses: {'200': {$ref: '#/components/responses/Membership'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
    delete:
      tags: [Families]
      operationId: removeFamilyMembership
      summary: Remove a family membership
      x-scope: family.admin
      parameters: [{$ref: '#/components/parameters/FamilyId'}, {$ref: '#/components/parameters/MembershipId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'204': {description: Membership removed}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /families/{familyId}/invites/{inviteId}/revoke:
    post:
      tags: [Invites]
      operationId: revokeFamilyInvite
      summary: Revoke a family invite
      x-scope: family.admin
      parameters: [{$ref: '#/components/parameters/FamilyId'}, {$ref: '#/components/parameters/InviteId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/InviteRevoked'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /family-invites/{joinAttemptId}/reject:
    post:
      tags: [Invites]
      operationId: rejectFamilyInvite
      summary: Reject a family invite
      x-scope: join.owner
      parameters: [{$ref: '#/components/parameters/JoinAttemptId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/InviteRejected'}, '404': {$ref: '#/components/responses/NotFound'}}
  /products:
    get:
      tags: [Catalog]
      operationId: searchProducts
      summary: Search products
      x-scope: family.read
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/SearchQuery'}]
      responses: {'200': {$ref: '#/components/responses/ProductList'}}
    post:
      tags: [Catalog]
      operationId: createProduct
      summary: Create a product
      x-scope: family.write
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CreateProductRequest'}
      responses: {'201': {$ref: '#/components/responses/Product'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /products/{productId}:
    get:
      tags: [Catalog]
      operationId: getProduct
      summary: Get a product
      x-scope: family.read
      parameters: [{$ref: '#/components/parameters/ProductId'}]
      responses: {'200': {$ref: '#/components/responses/Product'}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
      tags: [Catalog]
      operationId: updateProduct
      summary: Update a product
      x-scope: family.write
      parameters: [{$ref: '#/components/parameters/ProductId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/UpdateProductRequest'}
      responses: {'200': {$ref: '#/components/responses/Product'}, '409': {$ref: '#/components/responses/Conflict'}}
  /products/resolve-barcode:
    post:
      tags: [Catalog]
      operationId: resolveProductBarcode
      summary: Resolve a product barcode
      x-scope: family.read
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ResolveBarcodeRequest'}
      responses: {'200': {$ref: '#/components/responses/BarcodeResolution'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /catalog/import:
    post:
      tags: [Catalog]
      operationId: createCatalogImport
      summary: Create a catalog import
      x-scope: operator
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CatalogImportRequest'}
      responses: {'202': {$ref: '#/components/responses/JobAccepted'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /catalog/conflicts:
    get:
      tags: [Catalog]
      operationId: listCatalogConflicts
      summary: List catalog conflicts
      x-scope: catalog
      responses: {'200': {$ref: '#/components/responses/CatalogConflictList'}}
  /catalog/conflicts/{conflictId}/resolve:
    post:
      tags: [Catalog]
      operationId: resolveCatalogConflict
      summary: Resolve a catalog conflict
      x-scope: catalog
      parameters: [{$ref: '#/components/parameters/ConflictId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ResolveCatalogConflictRequest'}
      responses: {'200': {$ref: '#/components/responses/CatalogConflict'}, '409': {$ref: '#/components/responses/Conflict'}}
  /media/upload-intent:
    post:
      tags: [Recognition]
      operationId: createMediaUploadIntent
      summary: Create a media upload intent
      x-scope: family.write
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/MediaUploadIntentRequest'}
      responses: {'201': {$ref: '#/components/responses/MediaUploadIntent'}, '413': {$ref: '#/components/responses/QuotaExceeded'}}
  /recognition/jobs:
    post:
      tags: [Recognition]
      operationId: createRecognitionJob
      summary: Create a recognition job
      x-scope: recognition.write
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CreateRecognitionJobRequest'}
      responses: {'202': {$ref: '#/components/responses/JobAccepted'}, '503': {$ref: '#/components/responses/CapabilityUnavailable'}}
  /recognition/jobs/{jobId}:
    get:
      tags: [Recognition]
      operationId: getRecognitionJob
      summary: Get a recognition job
      x-scope: family.job
      parameters: [{$ref: '#/components/parameters/JobId'}]
      responses: {'200': {$ref: '#/components/responses/RecognitionJob'}, '404': {$ref: '#/components/responses/NotFound'}}
  /recognition/jobs/{jobId}/confirm:
    post:
      tags: [Recognition]
      operationId: confirmRecognitionJob
      summary: Confirm a recognition job
      x-scope: family.write
      parameters: [{$ref: '#/components/parameters/JobId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ConfirmRecognitionRequest'}
      responses: {'200': {$ref: '#/components/responses/RecognitionJob'}, '409': {$ref: '#/components/responses/Conflict'}}
  /recognition/jobs/{jobId}/cancel:
    post:
      tags: [Recognition]
      operationId: cancelRecognitionJob
      summary: Cancel a recognition job
      x-scope: job.owner
      parameters: [{$ref: '#/components/parameters/JobId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/RecognitionCancelled'}}
  /inventory:
    get:
      tags: [Inventory]
      operationId: listInventory
      summary: List inventory
      x-scope: inventory.read
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/SearchQuery'}]
      responses: {'200': {$ref: '#/components/responses/InventoryList'}}
  /inventory/items/{stockItemId}:
    get:
      tags: [Inventory]
      operationId: getStockItem
      summary: Get a stock item
      x-scope: inventory.read
      parameters: [{$ref: '#/components/parameters/StockItemId'}]
      responses: {'200': {$ref: '#/components/responses/StockItem'}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
      tags: [Inventory]
      operationId: updateStockItem
      summary: Update a stock item
      x-scope: inventory.write
      parameters: [{$ref: '#/components/parameters/StockItemId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/UpdateStockItemRequest'}
      responses: {'200': {$ref: '#/components/responses/StockItem'}, '409': {$ref: '#/components/responses/Conflict'}}
  /expiry:
    get:
      tags: [Inventory]
      operationId: listExpiringStock
      summary: List expiring stock
      x-scope: inventory.read
      responses: {'200': {$ref: '#/components/responses/ExpiryList'}}
  /consumption/estimate:
    post:
      tags: [Inventory]
      operationId: estimateConsumption
      summary: Estimate consumption
      x-scope: nutrition.consumption
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/EstimateConsumptionRequest'}
      responses: {'202': {$ref: '#/components/responses/JobAccepted'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /consumption/{consumptionId}/correct:
    post:
      tags: [Inventory]
      operationId: correctConsumption
      summary: Correct consumption
      x-scope: inventory.write
      parameters: [{$ref: '#/components/parameters/ConsumptionId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CorrectConsumptionRequest'}
      responses: {'200': {$ref: '#/components/responses/ConsumptionCorrection'}, '409': {$ref: '#/components/responses/Conflict'}}
  /shopping-lists:
    get:
      tags: [Shopping]
      operationId: listShoppingLists
      summary: List shopping lists
      x-scope: shopping.read
      responses: {'200': {$ref: '#/components/responses/ShoppingListCollection'}}
    post:
      tags: [Shopping]
      operationId: createShoppingList
      summary: Create a shopping list
      x-scope: shopping.write
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CreateShoppingListRequest'}
      responses: {'201': {$ref: '#/components/responses/ShoppingList'}}
  /shopping-lists/{listId}:
    get:
      tags: [Shopping]
      operationId: getShoppingList
      summary: Get a shopping list
      x-scope: shopping.read
      parameters: [{$ref: '#/components/parameters/ListId'}]
      responses: {'200': {$ref: '#/components/responses/ShoppingList'}, '404': {$ref: '#/components/responses/NotFound'}}
  /shopping-lists/{listId}/items:
    post:
      tags: [Shopping]
      operationId: addShoppingItem
      summary: Add a shopping item
      x-scope: shopping.write
      parameters: [{$ref: '#/components/parameters/ListId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/AddShoppingItemRequest'}
      responses: {'201': {$ref: '#/components/responses/ShoppingItem'}, '409': {$ref: '#/components/responses/Conflict'}}
  /shopping-lists/{listId}/items/{itemId}:
    patch:
      tags: [Shopping]
      operationId: updateShoppingItem
      summary: Update a shopping item
      x-scope: shopping.write
      parameters: [{$ref: '#/components/parameters/ListId'}, {$ref: '#/components/parameters/ItemId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/UpdateShoppingItemRequest'}
      responses: {'200': {$ref: '#/components/responses/ShoppingItem'}, '409': {$ref: '#/components/responses/Conflict'}}
  /shopping-lists/{listId}/items/{itemId}/complete:
    post:
      tags: [Shopping]
      operationId: completeShoppingItem
      summary: Complete a shopping item
      x-scope: shopping.write
      parameters: [{$ref: '#/components/parameters/ListId'}, {$ref: '#/components/parameters/ItemId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CompleteShoppingItemRequest'}
      responses: {'200': {$ref: '#/components/responses/ShoppingItem'}, '409': {$ref: '#/components/responses/Conflict'}}
  /shopping-lists/{listId}/items/{itemId}/load-to-inventory:
    post:
      tags: [Shopping]
      operationId: loadShoppingItemToInventory
      summary: Load a shopping item into inventory
      x-scope: inventory.write
      parameters: [{$ref: '#/components/parameters/ListId'}, {$ref: '#/components/parameters/ItemId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/LoadShoppingItemRequest'}
      responses: {'201': {$ref: '#/components/responses/InventoryLoad'}, '409': {$ref: '#/components/responses/Conflict'}}
  /shopping-lists/{listId}/batch-action:
    post:
      tags: [Shopping]
      operationId: applyShoppingBatchAction
      summary: Apply a shopping batch action
      x-scope: shopping.write
      parameters: [{$ref: '#/components/parameters/ListId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ShoppingBatchActionRequest'}
      responses: {'200': {$ref: '#/components/responses/ShoppingBatchAction'}, '409': {$ref: '#/components/responses/Conflict'}}
  /shopping-lists/{listId}/archive:
    post:
      tags: [Shopping]
      operationId: archiveShoppingList
      summary: Archive a shopping list
      x-scope: shopping.write
      parameters: [{$ref: '#/components/parameters/ListId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/ShoppingListArchived'}}
  /recipes/suggestions:
    get:
      tags: [Recipes]
      operationId: getRecipeSuggestions
      summary: Get recipe suggestions
      x-scope: recipe.read
      responses: {'200': {$ref: '#/components/responses/RecipeSuggestionList'}, '503': {$ref: '#/components/responses/CapabilityUnavailable'}}
  /recipes/jobs:
    post:
      tags: [Recipes]
      operationId: createRecipeJob
      summary: Create a recipe job
      x-scope: recipe.write
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CreateRecipeJobRequest'}
      responses: {'202': {$ref: '#/components/responses/JobAccepted'}, '428': {$ref: '#/components/responses/ConsentRequired'}}
  /recipes/{recipeId}:
    get:
      tags: [Recipes]
      operationId: getRecipe
      summary: Get a recipe
      x-scope: recipe.read
      parameters: [{$ref: '#/components/parameters/RecipeId'}]
      responses: {'200': {$ref: '#/components/responses/Recipe'}, '404': {$ref: '#/components/responses/NotFound'}}
  /recipes/{recipeId}/plan:
    post:
      tags: [Recipes]
      operationId: planRecipe
      summary: Plan a recipe
      x-scope: recipe.write
      parameters: [{$ref: '#/components/parameters/RecipeId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/PlanRecipeRequest'}
      responses: {'200': {$ref: '#/components/responses/RecipePlan'}}
  /recipes/{recipeId}/add-missing:
    post:
      tags: [Recipes]
      operationId: addMissingRecipeIngredients
      summary: Add missing recipe ingredients
      x-scope: shopping.write
      parameters: [{$ref: '#/components/parameters/RecipeId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'201': {$ref: '#/components/responses/ShoppingAdditions'}}
  /recipes/{recipeId}/cook:
    post:
      tags: [Recipes]
      operationId: confirmRecipeCooked
      summary: Confirm a recipe was cooked
      x-scope: inventory.write
      parameters: [{$ref: '#/components/parameters/RecipeId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ConfirmRecipeCookedRequest'}
      responses: {'200': {$ref: '#/components/responses/RecipeCooked'}}
  /nutrition/summary:
    get:
      tags: [Nutrition]
      operationId: getNutritionSummary
      summary: Get a nutrition summary
      x-scope: nutrition.read
      responses: {'200': {$ref: '#/components/responses/NutritionSummary'}}
  /nutrition/products/{productId}:
    get:
      tags: [Nutrition]
      operationId: getProductNutrition
      summary: Get product nutrition
      x-scope: nutrition.read
      parameters: [{$ref: '#/components/parameters/ProductId'}]
      responses: {'200': {$ref: '#/components/responses/ProductNutrition'}, '404': {$ref: '#/components/responses/NotFound'}}
  /offers:
    get:
      tags: [Offers]
      operationId: listOffers
      summary: List offers
      x-scope: offers.read
      responses: {'200': {$ref: '#/components/responses/OfferList'}, '503': {$ref: '#/components/responses/CapabilityUnavailable'}}
  /offers/import-jobs:
    post:
      tags: [Offers]
      operationId: createOffersImportJob
      summary: Create an offers import job
      x-scope: operator
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/OffersImportRequest'}
      responses: {'202': {$ref: '#/components/responses/JobAccepted'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /offers/{offerId}:
    get:
      tags: [Offers]
      operationId: getOffer
      summary: Get an offer
      x-scope: offers.read
      parameters: [{$ref: '#/components/parameters/OfferId'}]
      responses: {'200': {$ref: '#/components/responses/Offer'}, '404': {$ref: '#/components/responses/NotFound'}}
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List notifications
      x-scope: user
      responses: {'200': {$ref: '#/components/responses/NotificationList'}}
  /notification-preferences:
    patch:
      tags: [Notifications]
      operationId: updateNotificationPreferences
      summary: Update notification preferences
      x-scope: user
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/NotificationPreferencesRequest'}
      responses: {'200': {$ref: '#/components/responses/NotificationPreferences'}}
  /privacy/export:
    post:
      tags: [Privacy]
      operationId: createPrivacyExport
