openapi: 3.1.0
info:
  title: Gestione Dispensa Gateway API
  version: 2.0.0
  description: |
    Normative HTTP contract for the browser-facing Gateway.
    Implementations MUST conform to docs/API.md.
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Families
  - name: Inventory
  - name: Catalog
  - name: Shopping
  - name: Recipes
  - name: Nutrition
  - name: Stores
  - name: Notifications
  - name: OCR
  - name: Shelf-Life
  - name: Privacy
  - name: Composite
paths:
  /auth/register:
    post:
      operationId: register
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201': {description: Registration accepted, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '202': {description: Reset accepted, content: {application/json: {schema: {$ref: '#/components/schemas/ResetPasswordResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/logout:
    post:
      operationId: logout
      tags: [Identity]
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: false}}}}
      responses:
        '204': {description: Logout accepted}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /identity/me:
    get:
      operationId: getIdentityMe
      tags: [Identity]
      responses:
        '200': {description: Current profile, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      operationId: patchIdentityMe
      tags: [Identity]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProfilePatch'}}}}
      responses:
        '200': {description: Updated profile, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /families:
    get:
      operationId: getFamilies
      tags: [Families]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Families, content: {application/json: {schema: {$ref: '#/components/schemas/FamilyList'}}}}
    post:
      operationId: postFamilies
      tags: [Families]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateFamily'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
  /families/{familyId}/members:
    get:
      operationId: getFamiliesFamilyIdMembers
      tags: [Families]
      parameters: [{$ref: '#/components/parameters/FamilyId'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Members, content: {application/json: {schema: {$ref: '#/components/schemas/MemberList'}}}}
  /families/{familyId}/members/{userId}:
    patch:
      operationId: patchFamiliesFamilyIdMembersUserId
      tags: [Families]
      parameters:
        - {$ref: '#/components/parameters/FamilyId'}
        - {name: userId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateMemberRole'}}}}
      responses:
        '200': {description: Membership updated, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
    delete:
      operationId: deleteFamiliesFamilyIdMembersUserId
      tags: [Families]
      parameters:
        - {$ref: '#/components/parameters/FamilyId'}
        - {name: userId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: Removed}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /families/{familyId}:
    get:
      operationId: getFamiliesFamilyId
      tags: [Families]
      parameters: [{$ref: '#/components/parameters/FamilyId'}]
      responses:
        '200': {description: Family, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: patchFamiliesFamilyId
      tags: [Families]
      parameters: [{$ref: '#/components/parameters/FamilyId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PatchFamily'}}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
    delete:
      operationId: deleteFamiliesFamilyId
      tags: [Families]
      parameters: [{$ref: '#/components/parameters/FamilyId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /families/{familyId}/invites:
    get:
      operationId: getFamiliesFamilyIdInvites
      tags: [Families]
      parameters: [{$ref: '#/components/parameters/FamilyId'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Invites, content: {application/json: {schema: {$ref: '#/components/schemas/InviteList'}}}}
    post:
      operationId: postFamiliesFamilyIdInvites
      tags: [Families]
      parameters: [{$ref: '#/components/parameters/FamilyId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateInvite'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /families/{familyId}/invites/{inviteId}:
    delete:
      operationId: deleteFamiliesFamilyIdInvitesInviteId
      tags: [Families]
      parameters: [{$ref: '#/components/parameters/FamilyId'}, {$ref: '#/components/parameters/InviteId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: Revoked}
        '404': {$ref: '#/components/responses/NotFound'}
  /family-invites/resolve:
    post:
      operationId: resolveFamilyInvite
      tags: [Family]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveInviteRequest'}
      responses:
        '200': {description: Join attempt, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
  /family-invites/resolve-code:
    post:
      operationId: resolveFamilyInviteByCode
      tags: [Family]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveInviteCodeRequest'}
      responses:
        '200': {description: Join attempt, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
  /invites/{attemptId}/accept:
    post:
      operationId: acceptInviteAttempt
      tags: [Family]
      parameters:
        - {name: attemptId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptInviteAttempt'}
      responses:
        '201': {description: Membership created, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /family-invites/{token}:
    get:
      operationId: getFamilyInvitesToken
      security: []
      tags: [Families]
      parameters: [{$ref: '#/components/parameters/Token'}]
      responses:
        '200': {description: Invite preview, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}

  /inventory:
    get:
      operationId: getInventory
      tags: [Inventory]
      parameters:
        - {$ref: '#/components/parameters/FamilyQuery'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Current pantry, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryList'}}}}
  /inventory/items:
    post:
      operationId: postInventoryItems
      tags: [Inventory]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreatePantryItem'}}}}
      responses:
        '201': {description: Added, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
  /inventory/{itemId}:
    get:
      operationId: getInventoryItemId
      tags: [Inventory]
      parameters: [{$ref: '#/components/parameters/ItemId'}]
      responses:
        '200': {description: Pantry item, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: patchInventoryItemId
      tags: [Inventory]
      parameters: [{$ref: '#/components/parameters/ItemId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PatchPantryItem'}}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /inventory/{itemId}/consume:
    post:
      operationId: postInventoryItemIdConsume
      tags: [Inventory]
      parameters: [{$ref: '#/components/parameters/ItemId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConsumeRequest'}}}}
      responses:
        '200': {description: Consumed, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '422': {$ref: '#/components/responses/BusinessRule'}
  /inventory/{itemId}/waste:
    post:
      operationId: postInventoryItemIdWaste
      tags: [Inventory]
      parameters: [{$ref: '#/components/parameters/ItemId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WasteRequest'}}}}
      responses:
        '200': {description: Wasted, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '422': {$ref: '#/components/responses/BusinessRule'}
  /inventory/{itemId}/expiration/confirm:
    post:
      operationId: postInventoryItemIdExpirationConfirm
      tags: [Inventory]
      parameters: [{$ref: '#/components/parameters/ItemId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExpirationConfirm'}
      responses:
        '200': {description: Expiration confirmed, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '422': {$ref: '#/components/responses/BusinessRule'}
  /inventory/{itemId}/movements:
    get:
      operationId: getInventoryItemIdMovements
      tags: [Inventory]
      parameters: [{$ref: '#/components/parameters/ItemId'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Movements, content: {application/json: {schema: {$ref: '#/components/schemas/MovementList'}}}}
  /catalog/products:
    post:
      operationId: postCatalogProducts
      tags: [Catalog]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateProduct'}}}}
      responses:
        '201': {description: Product, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /catalog/products/{productId}:
    get:
      operationId: getCatalogProductsProductId
      tags: [Catalog]
      parameters: [{$ref: '#/components/parameters/ProductId'}]
      responses:
        '200': {description: Product, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: patchCatalogProductsProductId
      tags: [Catalog]
      parameters: [{$ref: '#/components/parameters/ProductId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PatchProduct'}}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /catalog/barcodes/{barcode}:
    get:
      operationId: getCatalogBarcodesBarcode
      tags: [Catalog]
      parameters:
        - {name: barcode, in: path, required: true, schema: {type: string, pattern: '^(?:[0-9]{8}|[0-9]{12}|[0-9]{13}|[0-9]{14})}}
        - {name: refresh, in: query, required: false, schema: {type: boolean, default: false}}
      responses:
        '200': {description: Resolved product, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /catalog/barcodes/resolve:
    post:
      operationId: postCatalogBarcodesResolve
      tags: [Catalog]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BarcodeRequest'}}}}
      responses:
        '200': {description: Resolved product, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /shopping/lists:
    get:
      operationId: getShoppingLists
      tags: [Shopping]
      parameters: [{$ref: '#/components/parameters/FamilyQuery'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Lists, content: {application/json: {schema: {$ref: '#/components/schemas/ShoppingListResponse'}}}}
    post:
      operationId: postShoppingLists
      tags: [Shopping]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateShoppingList'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /shopping/lists/{listId}:
    get:
      operationId: getShoppingListsListId
      tags: [Shopping]
      parameters: [{$ref: '#/components/parameters/ListId'}]
      responses:
        '200': {description: List, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /shopping/lists/{listId}/items:
    post:
      operationId: postShoppingListsListIdItems
      tags: [Shopping]
      parameters: [{$ref: '#/components/parameters/ListId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateShoppingItem'}}}}
      responses:
        '201': {description: Item, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /shopping/lists/{listId}/items/{itemId}:
    patch:
      operationId: patchShoppingListsListIdItemsItemId
      tags: [Shopping]
      parameters: [{$ref: '#/components/parameters/ListId'}, {$ref: '#/components/parameters/ShoppingItemId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PatchShoppingItem'}}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
    delete:
      operationId: deleteShoppingListsListIdItemsItemId
      tags: [Shopping]
      parameters: [{$ref: '#/components/parameters/ListId'}, {$ref: '#/components/parameters/ShoppingItemId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: Deleted}
  /shopping/lists/{listId}/close:
    post:
      operationId: postShoppingListsListIdClose
      tags: [Shopping]
      parameters: [{$ref: '#/components/parameters/ListId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PrivacyExportRequest'}}}}
      responses:
        '200': {description: Closed, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /recipes:
    get:
      operationId: getRecipes
      tags: [Recipes]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}, {name: q, in: query, schema: {type: string, maxLength: 200}}]
      responses:
        '200': {description: Recipes, content: {application/json: {schema: {$ref: '#/components/schemas/RecipeList'}}}}
    post:
      operationId: postRecipes
      tags: [Recipes]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateRecipe'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /recipes/{recipeId}:
    get:
      operationId: getRecipesRecipeId
      tags: [Recipes]
      parameters: [{$ref: '#/components/parameters/RecipeId'}]
      responses:
        '200': {description: Recipe, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
    patch:
      operationId: patchRecipesRecipeId
      tags: [Recipes]
      parameters: [{$ref: '#/components/parameters/RecipeId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PatchRecipe'}}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
    delete:
      operationId: deleteRecipesRecipeId
      tags: [Recipes]
      parameters: [{$ref: '#/components/parameters/RecipeId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: Deleted}
  /recipes/{recipeId}/add-missing:
    post:
      operationId: postRecipesRecipeIdAddMissing
      tags: [Recipes]
      parameters:
        - {$ref: '#/components/parameters/RecipeId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [familyId]
              additionalProperties: false
              properties:
                familyId: {$ref: '#/components/schemas/Uuid'}
      responses:
        '200': {description: Missing ingredients added, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
  /recipes/suggestions:
    get:
      operationId: getRecipesSuggestions
      tags: [Recipes]
      parameters: [{$ref: '#/components/parameters/FamilyQuery'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Suggestions, content: {application/json: {schema: {$ref: '#/components/schemas/RecipeSuggestionList'}}}}
  /nutrition/targets:
    get:
      operationId: getNutritionTargets
      tags: [Nutrition]
      responses:
        '200': {description: Targets, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
    put:
      operationId: putNutritionTargets
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      tags: [Nutrition]

      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NutritionTargets'}}}}
      responses:
        '200': {description: Targets, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /nutrition/diary:
    get:
      operationId: getNutritionDiary
      tags: [Nutrition]
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Diary, content: {application/json: {schema: {$ref: '#/components/schemas/DiaryList'}}}}
    post:
      operationId: postNutritionDiary
      tags: [Nutrition]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateDiaryEntry'}}}}
      responses:
        '201': {description: Entry, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /nutrition/summary:
    get:
      operationId: getNutritionSummary
      tags: [Nutrition]
      parameters:
        - {name: familyId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: period, in: query, required: false, schema: {type: string, enum: [today, week], default: today}}
      responses:
        '200': {description: Nutrition summary, content: {application/json: {schema: {$ref: '#/components/schemas/NutritionSummaryResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /stores:
    get:
      operationId: getStores
      tags: [Stores]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}, {name: q, in: query, schema: {type: string}}]
      responses:
        '200': {description: Stores, content: {application/json: {schema: {$ref: '#/components/schemas/StoreList'}}}}
    post:
      operationId: postStores
      tags: [Stores]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateStore'}}}}
      responses:
        '201': {description: Store, content: {application/json: {schema: {$ref: '#/components/schemas/DataResponse'}}}}
  /stores/{storeId}/prices:
    get:
      operationId: getStoresStoreIdPrices
      tags: [Stores]
      parameters: [{$ref: '#/components/parameters/StoreId'}, {name: productId, in: query, schema: {$ref: '#/components/schemas/Uuid'}}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Prices, content: {application/json: {schema: {$ref: '#/components/schemas/PriceList'}}}}
    post:
      operationId: postStoresStoreIdPrices
      tags: [Stores]
      parameters: [{$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
