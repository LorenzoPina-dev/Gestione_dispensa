name: contract-and-typecheck

on:
  push:
    branches: [architecture/microservices-v2]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Clean install from committed lockfile
        run: npm ci --ignore-scripts
      - name: Contract audit
        run: npm run contract:audit
      - name: Typecheck
        run: npm run typecheck