name: sync-search-lock

on:
  push:

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/architecture/microservices-v2' && contains(github.event.head_commit.message, '[sync-search-lock]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/microservices-v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Sync package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes."
            exit 0
          fi
          git commit -m "fix(lockfile): add search-indexer dev dependencies"
          git push origin HEAD:architecture/microservices-v2
