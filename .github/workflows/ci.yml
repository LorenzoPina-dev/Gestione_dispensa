name: CI

on:
  pull_request:
  push:
    branches: [main, architecture/microservices-v2]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Clean install from committed lockfile
        run: npm ci --ignore-scripts
      - name: Contract audit
        run: npm run contract:audit
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test

  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose --profile family-local config --quiet
      - name: Validate rendered services
        run: |
          test "$(docker compose config --services | wc -l)" -ge 20
          docker compose config --images
      - name: Build every application image
        run: docker compose build --pull --parallel

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dispensa
          POSTGRES_PASSWORD: dispensa
          POSTGRES_DB: gestione_dispensa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispensa -d gestione_dispensa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FAMILY_DATABASE_URL: postgresql://dispensa:dispensa@localhost:5432/family_db
      INVENTORY_DATABASE_URL: postgresql://dispensa:dispensa@localhost:5432/inventory_db
      CATALOG_DATABASE_URL: postgresql://dispensa:dispensa@localhost:5432/catalog_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: npm ci --ignore-scripts
      - name: Prepare isolated service databases
        run: |
          psql "postgresql://dispensa:dispensa@localhost:5432/gestione_dispensa" -c "CREATE DATABASE family_db;"
          psql "postgresql://dispensa:dispensa@localhost:5432/gestione_dispensa" -c "CREATE DATABASE inventory_db;"
          psql "postgresql://dispensa:dispensa@localhost:5432/gestione_dispensa" -c "CREATE DATABASE catalog_db;"
          psql "$FAMILY_DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          psql "$INVENTORY_DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          psql "$CATALOG_DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
      - run: npm run typecheck
      - run: npm run build
      - name: Run service-family migration schema tests
        env:
          FAMILY_TEST_DATABASE_URL: ${{ env.FAMILY_DATABASE_URL }}
        working-directory: services/service-family
        run: npm run test:migration
      - name: Run service-inventory migration schema tests
        env:
          INVENTORY_TEST_DATABASE_URL: ${{ env.INVENTORY_DATABASE_URL }}
        working-directory: services/service-inventory
        run: npm run test:migration
      - name: Run service-catalog migration schema tests
        env:
          CATALOG_TEST_DATABASE_URL: ${{ env.CATALOG_DATABASE_URL }}
        working-directory: services/service-catalog
        run: npm run test:migration
      - name: Start service-family against the real test database
        run: |
          nohup env DATABASE_URL="$FAMILY_DATABASE_URL" PORT=3311 node services/service-family/dist/server.js > /tmp/service-family.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3311/health/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/service-family.log
          exit 1
      - name: Run service-family real integration flow
        env:
          FAMILY_TEST_URL: http://127.0.0.1:3311
          FAMILY_TEST_DATABASE_URL: ${{ env.FAMILY_DATABASE_URL }}
        working-directory: services/service-family
        run: npm run test:integration
      - name: Start service-inventory against real PostgreSQL and real Family
        run: |
          nohup env DATABASE_URL="$INVENTORY_DATABASE_URL" PORT=3312 FAMILY_SERVICE_BASE_URL=http://127.0.0.1:3311 node services/service-inventory/dist/server.js > /tmp/service-inventory.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3312/health/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/service-inventory.log
          exit 1
      - name: Run service-inventory real cross-service flow
        env:
          INVENTORY_TEST_URL: http://127.0.0.1:3312
          INVENTORY_TEST_FAMILY_URL: http://127.0.0.1:3311
          INVENTORY_TEST_DATABASE_URL: ${{ env.INVENTORY_DATABASE_URL }}
        working-directory: services/service-inventory
        run: npm run test:integration
      - name: Run service-catalog real repository flow
        env:
          CATALOG_TEST_DATABASE_URL: ${{ env.CATALOG_DATABASE_URL }}
        working-directory: services/service-catalog
        run: npm run test:integration
