x-node-healthcheck: &node-healthcheck
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

# Unica sorgente di verità per la verifica dei JWT: l'issuer è l'URL pubblico (quello che il browser usa
# passando da nginx) e coincide con KC_HOSTNAME di Keycloak. JWKS/discovery vanno invece sulla rete interna.
x-oidc-env: &oidc-env
  OIDC_ISSUER: "https://${LAN_HOST:-localhost}:8443/realms/dispensa"
  OIDC_AUDIENCE: "account"
  OIDC_DISCOVERY_URL: "http://keycloak:8080/realms/dispensa/.well-known/openid-configuration"
  OIDC_JWKS_URL: "http://keycloak:8080/realms/dispensa/protocol/openid-connect/certs"

services:
  nginx:
    build: { context: ./infrastructure/nginx }
    ports: ["8443:8443"]
    environment: { TLS_CERT_DAYS: "825", TLS_SAN: "DNS:localhost,IP:127.0.0.1,IP:${LAN_HOST:-192.168.1.24}" }
    volumes: ["./certs:/etc/nginx/certs"]
    depends_on:
      gateway: { condition: service_healthy }
      web: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    restart: unless-stopped
    networks: [edge, backend]
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    healthcheck: { test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/healthz"], interval: 10s, timeout: 3s, retries: 5, start_period: 5s }
    restart: unless-stopped
    networks: [edge]
  gateway:
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    environment:
      PORT: 3300
      SERVICE_NAME: gateway
      IDENTITY_SERVICE_BASE_URL: "http://service-identity:3310/api/v1"
      FAMILY_SERVICE_BASE_URL: "http://service-family:3311/api/v1"
      SHOPPING_SERVICE_BASE_URL: "http://service-shopping:3313/api/v1"
      CATALOG_SERVICE_BASE_URL: "http://service-catalog:3314/api/v1"
      NOTIFICATIONS_SERVICE_BASE_URL: "http://service-notifications:3315/api/v1"
      PRIVACY_SERVICE_BASE_URL: "http://service-privacy:3316/api/v1"
      JOBS_SERVICE_BASE_URL: "http://service-jobs:3317/api/v1"
      RECIPES_SERVICE_BASE_URL: "http://service-recipes:3401/api/v1"
      STORES_SERVICE_BASE_URL: "http://service-stores:3403/api/v1"
      SHELF_LIFE_SERVICE_BASE_URL: "http://service-shelf-life:3404/api/v1"
      OCR_SERVICE_BASE_URL: "http://service-ocr:3405/api/v1"
      GATEWAY_TIMEOUT_MS: "15000"
      <<: *oidc-env
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    # Dipendenze del gateway. Il gateway è un proxy che gestisce già a runtime l'indisponibilità dei singoli
    # servizi (risponde 502 per quella richiesta), quindi il suo avvio NON deve dipendere da tutto lo stack:
    # nginx dipende dal gateway, e un servizio secondario guasto (es. OCR/MinIO) spegnerebbe l'intera app.
    #  - core: servono per autenticare e usare l'app (identità, famiglia, dispensa, spesa, catalogo, Keycloak);
    #  - `required: false`: Compose li avvia e li attende, ma se non diventano healthy avvia comunque il gateway
    #    (solo un warning). Un servizio secondario guasto degrada una funzione invece di fermare tutto.
    # `required: false` richiede Docker Compose >= 2.20.
    depends_on:
      service-identity: { condition: service_healthy }
      service-family: { condition: service_healthy }
      service-inventory: { condition: service_healthy }
      service-shopping: { condition: service_healthy }
      service-catalog: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      service-notifications: { condition: service_healthy, required: false }
      service-privacy: { condition: service_healthy, required: false }
      service-jobs: { condition: service_healthy, required: false }
      service-recipes: { condition: service_healthy, required: false }
      service-nutrition: { condition: service_healthy, required: false }
      service-stores: { condition: service_healthy, required: false }
      service-shelf-life: { condition: service_healthy, required: false }
      service-ocr: { condition: service_healthy, required: false }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend]
  alloy:
    image: grafana/alloy:latest
    command: run /etc/alloy/config.alloy
    volumes: [./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro, /var/run/docker.sock:/var/run/docker.sock:ro]
    restart: unless-stopped
    networks: [data]
  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/loki.yml
    volumes: [loki_data:/loki, ./infrastructure/loki/loki.yml:/etc/loki/loki.yml:ro]
    restart: unless-stopped
    networks: [data]
  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes: [tempo_data:/var/tempo, ./infrastructure/tempo/tempo.yml:/etc/tempo.yml:ro]
    restart: unless-stopped
    networks: [data]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otel-collector.yml"]
    volumes: [./infrastructure/otel/otel-collector.yml:/etc/otel-collector.yml:ro]
    depends_on: { tempo: { condition: service_started } }
    restart: unless-stopped
    networks: [backend, data]
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: [./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro]
    restart: unless-stopped
    networks: [backend, data]
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SERVER_ROOT_URL: "https://localhost:8443/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_METRICS_ENABLED: "true"
    depends_on:
      prometheus: { condition: service_started }
      loki: { condition: service_started }
    volumes: [grafana_data:/var/lib/grafana, ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro, ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro]
    restart: unless-stopped
    networks: [backend, data]
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    volumes: [/:/rootfs:ro, /var/run:/var/run:ro, /sys:/sys:ro, /var/lib/docker:/var/lib/docker:ro, /dev/disk:/dev/disk:ro]
    restart: unless-stopped
    networks: [data]
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: dispensa, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-dispensa}", POSTGRES_DB: postgres }
    volumes: [postgres_data:/var/lib/postgresql/data, ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U dispensa -d postgres"], interval: 5s, timeout: 5s, retries: 10, start_period: 5s }
    restart: unless-stopped
    networks: [data]
  postgres-app-role-init:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dispensa
      PGPASSWORD: "${POSTGRES_PASSWORD:-dispensa}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:-change-me-app-local-only}"
      KEYCLOAK_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:-change-me-keycloak-local-only}"
    command:
      - sh
      - -ceu
      - |
        sql_escape() { printf "%s" "$$1" | sed "s/\x27/\x27\x27/g"; }
        app_password=$$(sql_escape "$$POSTGRES_APP_PASSWORD")
        for role in identity_app family_app inventory_app shopping_app catalog_app notifications_app privacy_app jobs_app recipes_app nutrition_app stores_app shelf_life_app ocr_app food_semantics_app food_semantics; do
          if psql -v ON_ERROR_STOP=1 --host=postgres --username=dispensa --dbname=postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = '$$role'" | grep -q 1; then
            psql -v ON_ERROR_STOP=1 --host=postgres --username=dispensa --dbname=postgres -c "ALTER ROLE \"$$role\" LOGIN PASSWORD '$$app_password';"
          else
            psql -v ON_ERROR_STOP=1 --host=postgres --username=dispensa --dbname=postgres -c "CREATE ROLE \"$$role\" LOGIN PASSWORD '$$app_password';"
          fi
        done
        if ! psql -v ON_ERROR_STOP=1 --host=postgres --username=dispensa --dbname=postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'keycloak'" | grep -q 1; then
          psql -v ON_ERROR_STOP=1 --host=postgres --username=dispensa --dbname=postgres -c "CREATE ROLE keycloak LOGIN PASSWORD '$$KEYCLOAK_DB_PASSWORD';"
        fi
        if ! psql -v ON_ERROR_STOP=1 --host=postgres --username=dispensa --dbname=postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'food_semantics_db'" | grep -q 1; then
          psql -v ON_ERROR_STOP=1 --host=postgres --username=dispensa --dbname=postgres -c "CREATE DATABASE food_semantics_db OWNER food_semantics_app;"
        else
          psql -v ON_ERROR_STOP=1 --host=postgres --username=dispensa --dbname=postgres -c "ALTER DATABASE food_semantics_db OWNER TO food_semantics_app;"
        fi
        if ! psql -v ON_ERROR_STOP=1 --host=postgres --username=dispensa --dbname=postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak_db'" | grep -q 1; then
          psql -v ON_ERROR_STOP=1 --host=postgres --username=dispensa --dbname=postgres -c "CREATE DATABASE keycloak_db OWNER keycloak;"
        else
          psql -v ON_ERROR_STOP=1 --host=postgres --username=dispensa --dbname=postgres -c "ALTER DATABASE keycloak_db OWNER TO keycloak;"
        fi
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [data]
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: "postgresql://dispensa:dispensa@postgres:5432/postgres?sslmode=disable"
    depends_on: { postgres-app-role-init: { condition: service_completed_successfully } }
    restart: unless-stopped
    networks: [data]
  mongodb:
    image: mongo:8
    command: ["mongod", "--wiredTigerCacheSizeGB", "2"]
    cpus: 2.0
    mem_limit: 5g
    volumes: [mongo_data:/data/db]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"], interval: 10s, timeout: 5s, retries: 10, start_period: 10s }
    restart: unless-stopped
    networks: [data]

  # One-shot migration for existing dumps: the text index is no longer needed because
  # OpenSearch is the sole text-search engine. The barcode/code index remains.
  # One-shot maintenance for the OFF Mongo source. This service NEVER deletes products based
  # on completeness: completeness is metadata/quality, not a presence gate. It only ensures the
  # products collection and its barcode index exist and removes the obsolete Mongo text index.
  off-mongodb-index-maintenance:
    image: mongo:8
    cpus: 1.0
    mem_limit: 1g
    command:
      - mongosh
      - mongodb://mongodb:27017/off_lookup_db
      - --quiet
      - --eval
      - >-
        const collections=db.getCollectionNames();
        if(!collections.includes("products")){db.createCollection("products");print("Mongo products collection created");}
        const idx=db.products.getIndexes();
        const keywords=idx.find(i=>i.name==="keywords_1" || (i.key && i.key._keywords===1));
        if(keywords){print("Dropping obsolete Mongo text index "+keywords.name);db.products.dropIndex(keywords.name);}
        else{print("Mongo text index already absent");}
        const codeIndex=idx.find(i=>i.name==="code_1" || (i.key && i.key.code===1));
        if(!codeIndex) db.products.createIndex({code:1},{name:"code_1"});
        print("OFF Mongo source maintenance completed without deleting product data");
    depends_on:
      mongodb: { condition: service_healthy }
    restart: "no"
    networks: [data]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: [redis_data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped
    networks: [data]
  redis-exporter:
    image: oliver006/redis_exporter:v1.75.0
    environment: { REDIS_ADDR: "redis://redis:6379" }
    depends_on: { redis: { condition: service_healthy } }
    restart: unless-stopped
    networks: [data]
  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minio-local}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-change-me-local-only}", MINIO_PROMETHEUS_AUTH_TYPE: public }
    volumes: [minio_data:/data]
    healthcheck:
      disable: true
    restart: unless-stopped
    networks: [data]

  minio-ready:
    image: busybox:1.37.0
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      minio: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://minio:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped
    networks: [data]
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment: { discovery.type: single-node, DISABLE_SECURITY_PLUGIN: "true", OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m" }
    volumes: [opensearch_data:/usr/share/opensearch/data]
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"], interval: 10s, timeout: 5s, retries: 15, start_period: 20s }
    restart: unless-stopped
    networks: [data]
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: start --http-port=8080 --import-realm --metrics-enabled=true --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-change-me-local-only}"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:-change-me-keycloak-local-only}"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # URL pubblico fisso: l'`iss` dei token è sempre quello, qualunque Host arrivi da nginx.
      KC_HOSTNAME: "https://${LAN_HOST:-localhost}:8443"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # Keycloak usa PostgreSQL come datastore persistente; il file di realm è importato al bootstrap.
    depends_on:
      postgres-app-role-init: { condition: service_completed_successfully }
    healthcheck: { test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; read -r line <&3; case \"$$line\" in *' 200 '*) exit 0;; *) exit 1;; esac"], interval: 10s, timeout: 5s, retries: 30, start_period: 60s }
    restart: unless-stopped
    # `data` serve per raggiungere postgres (che sta solo su `data`); `backend` per gateway/nginx/servizi.
    networks: [backend, data]
  service-identity:
    build: { context: ., dockerfile: services/service-identity/Dockerfile }
    environment:
      PORT: 3310
      SERVICE_NAME: service-identity
      DATABASE_URL: "postgres://identity_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/identity_db"
      MIGRATION_DATABASE_URL: "postgres://identity:identity@postgres:5432/identity_db"
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: dispensa
      # Credenziali admin Keycloak (le stesse di KC_BOOTSTRAP_ADMIN_*), usate solo dal backend per creare utenti.
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-change-me-local-only}"
      OIDC_ISSUER: "https://${LAN_HOST:-localhost}:8443/realms/dispensa"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dispensa-internal-dev}"
    depends_on: { postgres-app-role-init: { condition: service_completed_successfully }, keycloak: { condition: service_healthy } }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]

  service-family:
    build: { context: ., dockerfile: services/service-family/Dockerfile }
    environment: { PORT: 3311, SERVICE_NAME: service-family, DATABASE_URL: "postgres://family_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/family_db", OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318", MIGRATION_DATABASE_URL: "postgres://family:family@postgres:5432/family_db" }
    depends_on: { postgres-app-role-init: { condition: service_completed_successfully } }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]

  service-inventory:
    build: { context: ., dockerfile: services/service-inventory/Dockerfile }
    environment:
      PORT: 3312
      SERVICE_NAME: service-inventory
      DATABASE_URL: "postgres://inventory_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/inventory_db"
      MIGRATION_DATABASE_URL: "postgres://inventory:inventory@postgres:5432/inventory_db"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres-app-role-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]

  service-shopping:
    build: { context: ., dockerfile: services/service-shopping/Dockerfile }
    environment: { PORT: 3313, SERVICE_NAME: service-shopping, DATABASE_URL: "postgres://shopping_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/shopping_db", FAMILY_SERVICE_BASE_URL: "http://service-family:3311/api/v1", FOOD_SEMANTICS_SERVICE_BASE_URL: "http://service-food-semantics:3410/api/v1", MIGRATION_DATABASE_URL: "postgres://shopping:shopping@postgres:5432/shopping_db" }
    depends_on:
      postgres-app-role-init: { condition: service_completed_successfully }
      service-food-semantics: { condition: service_healthy }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]

  service-catalog:
    build: { context: ., dockerfile: services/service-catalog/Dockerfile }
    environment:
      PORT: 3314
      SERVICE_NAME: service-catalog
      DATABASE_URL: "postgres://catalog_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/catalog_db"
      MIGRATION_DATABASE_URL: "postgres://catalog:catalog@postgres:5432/catalog_db"
      FOOD_SEMANTICS_SERVICE_BASE_URL: "http://service-food-semantics:3410/api/v1"
      <<: *oidc-env
      OFF_LOOKUP_BASE_URL: "http://off-lookup:3200"
      OFF_LOOKUP_TIMEOUT_MS: "2500"
      OFF_LOOKUP_SEARCH_TIMEOUT_MS: "9000"
      OFF_LOOKUP_INTERNAL_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dispensa-internal-dev}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dispensa-internal-dev}"
    depends_on:
      postgres-app-role-init: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      service-food-semantics: { condition: service_healthy }
    # Readiness includes PostgreSQL and OIDC discovery. Liveness remains available during bootstrap.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 120s
    restart: unless-stopped
    networks: [backend, data]

  service-notifications:
    build: { context: ., dockerfile: services/service-notifications/Dockerfile }
    environment: { PORT: 3315, SERVICE_NAME: service-notifications, DATABASE_URL: "postgres://notifications_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/notifications_db", FAMILY_SERVICE_BASE_URL: "http://service-family:3311/api/v1", MIGRATION_DATABASE_URL: "postgres://notifications:notifications@postgres:5432/notifications_db" }
    depends_on: { postgres-app-role-init: { condition: service_completed_successfully } }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]

  service-privacy:
    build: { context: ., dockerfile: services/service-privacy/Dockerfile }
    environment: { <<: *oidc-env, PORT: 3316, SERVICE_NAME: service-privacy, DATABASE_URL: "postgres://privacy_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/privacy_db", JOBS_SERVICE_BASE_URL: "http://service-jobs:3317/api/v1", INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dispensa-internal-dev}", MIGRATION_DATABASE_URL: "postgres://privacy:privacy@postgres:5432/privacy_db" }
    depends_on: { postgres-app-role-init: { condition: service_completed_successfully }, keycloak: { condition: service_healthy } }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]

  service-jobs:
    build: { context: ., dockerfile: services/service-jobs/Dockerfile }
    environment: { <<: *oidc-env, PORT: 3317, SERVICE_NAME: service-jobs, DATABASE_URL: "postgres://jobs_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/jobs_db", INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dispensa-internal-dev}", MIGRATION_DATABASE_URL: "postgres://jobs:jobs@postgres:5432/jobs_db" }
    depends_on: { postgres-app-role-init: { condition: service_completed_successfully }, keycloak: { condition: service_healthy } }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]

  libretranslate:
    image: libretranslate/libretranslate:latest
    command: ["--load-only","en,it,fr,es,de","--disable-web-ui"]
    volumes: [translation_models:/home/libretranslate/.local]
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5000/languages\", timeout=3)"], interval: 15s, timeout: 5s, retries: 20, start_period: 30s }
    restart: unless-stopped
    networks: [backend, egress]
  service-food-semantics-schema-migrate:
    build: { context: ., dockerfile: services/service-food-semantics/Dockerfile }
    environment: { DATABASE_URL: "postgres://food_semantics_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/food_semantics_db" }
