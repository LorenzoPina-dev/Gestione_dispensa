      OCR_PROVIDER_TOKEN: "${OCR_PROVIDER_TOKEN:-}"
    depends_on:
      postgres-app-role-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      # MinIO è secondario: se non è pronto (es. AIStor senza licenza) lo stack parte comunque e solo l'OCR resta degradato.
      minio-ready: { condition: service_healthy, required: false }
    healthcheck: *node-healthcheck
    restart: unless-stopped
