      OFF_LOOKUP_SOURCE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dispensa-internal-dev}"
      OFF_LOOKUP_SOURCE_TIMEOUT_MS: "3000"
      OFF_SEARCH_BOOTSTRAP_ENABLED: "true"
      OFF_SEARCH_BOOTSTRAP_BATCH_SIZE: "500"
      OFF_SEARCH_BOOTSTRAP_BATCH_DELAY_MS: "500"
      OFF_SEARCH_BOOTSTRAP_MAX_BATCHES_PER_RUN: "50"
      OFF_SEARCH_BOOTSTRAP_DELAY_MS: "3000"
      OFF_SEARCH_BOOTSTRAP_RETRY_MS: "30000"
      OFF_SEARCH_MIN_COMPLETENESS: "0.7"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    depends_on:
      opensearch: { condition: service_healthy }
      off-lookup: { condition: service_healthy }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]

  off-lookup:
    build:
      context: .
      dockerfile: services/off-lookup/Dockerfile
    environment:
      OFF_LOOKUP_PORT: 3200
      OFF_LOOKUP_MONGO_URL: "mongodb://mongodb:27017"
      OFF_LOOKUP_MONGO_DB: off_lookup_db
      OFF_LOOKUP_MONGO_COLLECTION: products
      OFF_LOOKUP_API_REFRESH_COOLDOWN_MS: "600000"
      OFF_LOOKUP_SEARCH_BASE_URL: "https://search.openfoodfacts.org"
      OFF_LOOKUP_SEARCH_TIMEOUT_MS: "8000"
      OFF_LOOKUP_SEARCH_CACHE_MS: "30000"
      OFF_LOOKUP_SEARCH_INDEXER_BASE_URL: "http://search-indexer:3210"
      OFF_LOOKUP_SEARCH_INDEXER_TOKEN: "${SEARCH_INDEXER_INTERNAL_TOKEN:-dispensa-internal-dev}"
      OFF_LOOKUP_INTERNAL_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dispensa-internal-dev}"
      OFF_LOOKUP_SEARCH_INDEXER_TIMEOUT_MS: "4500"
      OFF_LOOKUP_SEARCH_INDEXER_WRITE_TIMEOUT_MS: "2500"
      OFF_LOOKUP_MONGO_SOURCE_TIMEOUT_MS: "10000"
      OFF_LOOKUP_MIN_COMPLETENESS: "0"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    depends_on:
      off-mongodb-index-maintenance: { condition: service_completed_successfully }
    healthcheck: { test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3200/health/live"], interval: 10s, timeout: 3s, retries: 5, start_period: 10s }
    restart: unless-stopped
    networks: [backend, data, egress]

  off-image-integration-test:
    build:
      context: .
      dockerfile: services/off-lookup/Dockerfile.integration
    environment:
      OFF_LOOKUP_IMAGE_INTEGRATION: "1"
      OFF_LOOKUP_IMAGE_TEST_LIMIT: "10"
      OFF_LOOKUP_MONGO_URL: "mongodb://mongodb:27017"
      OFF_LOOKUP_MONGO_DB: off_lookup_db
      OFF_LOOKUP_MONGO_COLLECTION: products
      OFF_LOOKUP_API_BASE_URL: "https://world.openfoodfacts.org"
    depends_on:
      off-mongodb-index-maintenance: { condition: service_completed_successfully }
    profiles: ["integration"]
    networks: [data, egress]

