x-app-healthcheck: &app-healthcheck
  test:
    - CMD
    - node
    - -e
    - "fetch('http://127.0.0.1:'+process.env.PORT+'/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8443:8443"]
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on: [gateway, web]
    networks: [edge, backend]

  web:
    build: ./services/web
    networks: [edge]

  gateway:
    build: ./services/gateway
    environment:
      PORT: 3000
      SERVICE_NAME: gateway
      IDENTITY_URL: http://identity:3010
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      identity:
        condition: service_healthy
    healthcheck: *app-healthcheck
    networks: [backend]

  alloy:
    image: grafana/alloy:latest
    command: run /etc/alloy/config.alloy
    volumes:
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [data]

  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - loki_data:/loki
      - ./infrastructure/loki/loki.yml:/etc/loki/loki.yml:ro
    networks: [data]

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - tempo_data:/var/tempo
      - ./infrastructure/tempo/tempo.yml:/etc/tempo.yml:ro
    networks: [data]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./infrastructure/otel/otel-collector.yml:/etc/otel-collector.yml:ro
    networks: [backend, data]
    depends_on: [tempo]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks: [backend, data]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SERVER_ROOT_URL: https://localhost:8443/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    depends_on: [prometheus, loki]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [backend, data]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [data]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://dispensa:dispensa@postgres:5432/postgres?sslmode=disable
    networks: [data]

  redis-exporter:
    image: oliver006/redis_exporter:v1.75.0
    environment:
      REDIS_ADDR: redis://redis:6379
    networks: [data]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:9092"]
    networks: [data, messaging]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dispensa
      POSTGRES_PASSWORD: dispensa
      POSTGRES_DB: postgres
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]

  mongodb:
    image: mongo:8
    volumes: [mongo_data:/data/db]
    networks: [data]

  redis:
    image: redis:7-alpine
    networks: [data]

  kafka:
    image: apache/kafka:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes: [kafka_data:/tmp/kraft-combined-logs]
    networks: [messaging]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniochange
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes: [minio_data:/data]
    networks: [data]

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: [opensearch_data:/usr/share/opensearch/data]
    networks: [data]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --http-port=8080 --import-realm --metrics-enabled=true --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    volumes:
      - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks: [backend]

  identity:
    build: ./services/identity
    environment:
      PORT: 3010
      SERVICE_NAME: identity
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: dispensa
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      keycloak:
        condition: service_started
    healthcheck: *app-healthcheck
    networks: [backend, data]
  users:
    build: ./services/users
    environment: { PORT: 3011, SERVICE_NAME: users }
    networks: [backend, data]
  families:
    build: ./services/families
    environment: { PORT: 3012, SERVICE_NAME: families }
    networks: [backend, data]
  products:
    build: ./services/products
    environment: { PORT: 3013, SERVICE_NAME: products }
    networks: [backend, data]
  barcode:
    build: ./services/barcode
    environment: { PORT: 3014, SERVICE_NAME: barcode }
    networks: [backend, data]
  vision:
    build: ./services/vision
    environment: { PORT: 3015, SERVICE_NAME: vision }
    networks: [backend, data]
  inventory:
    build: ./services/inventory
    environment: { PORT: 3016, SERVICE_NAME: inventory }
    networks: [backend, data]
  expiration:
    build: ./services/expiration
    environment: { PORT: 3017, SERVICE_NAME: expiration }
    networks: [backend, data]
  shopping:
    build: ./services/shopping
    environment: { PORT: 3018, SERVICE_NAME: shopping }
    networks: [backend, data]
  stores:
    build: ./services/stores
    environment: { PORT: 3019, SERVICE_NAME: stores }
    networks: [backend, data]
  offers:
    build: ./services/offers
    environment: { PORT: 3020, SERVICE_NAME: offers }
    networks: [backend, data]
  recipes:
    build: ./services/recipes
    environment: { PORT: 3021, SERVICE_NAME: recipes }
    networks: [backend, data]
  nutrition:
    build: ./services/nutrition
    environment: { PORT: 3022, SERVICE_NAME: nutrition }
    networks: [backend, data]
  notifications:
    build: ./services/notifications
    environment: { PORT: 3023, SERVICE_NAME: notifications }
    networks: [backend, data, messaging]
  media:
    build: ./services/media
    environment: { PORT: 3024, SERVICE_NAME: media }
    networks: [backend, data]
  search:
    build: ./services/search
    environment: { PORT: 3025, SERVICE_NAME: search }
    networks: [backend, data]
  analytics:
    build: ./services/analytics
    environment: { PORT: 3026, SERVICE_NAME: analytics }
    networks: [backend, data, messaging]

volumes:
  postgres_data:
  mongo_data:
  kafka_data:
  minio_data:
  grafana_data:
  loki_data:
  tempo_data:
  opensearch_data:

networks:
  edge:
  backend:
  data:
    internal: true
  messaging:
    internal: true
