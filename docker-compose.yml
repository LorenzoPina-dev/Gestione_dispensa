name: gestione-dispensa

# Every service (api, postgres, redis, keycloak, minio, observability stack)
# is defined once in infra/compose/family-local.yml. This file previously
# also redefined api/postgres/redis directly below its `include:` line, with
# the include path itself broken (missing newline before the second `name:`
# key caused YAML to parse it as a mapping, not a path -- confirmed via
# `python3 -c "import yaml; yaml.safe_load(...)"`, which returned
# {'./infra/compose/family-local.ymlname': 'gestione-dispensa'} instead of a
# plain path). Fixed by keeping this file to a single `include:` and letting
# infra/compose/family-local.yml be the single source of truth.
include:
  - ./infra/compose/family-local.yml
