      DATABASE_URL: "postgres://ocr_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/ocr_db"
      MIGRATION_DATABASE_URL: "postgres://ocr:ocr@postgres:5432/ocr_db"
      REDIS_URL: "redis://redis:6379"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minio-local}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-change-me-local-only}"
      MINIO_BUCKET: gestione-dispensa
