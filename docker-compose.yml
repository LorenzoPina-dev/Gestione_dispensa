x-node-healthcheck: &node-healthcheck
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

# Unica sorgente di verità per la verifica dei JWT: l'issuer è l'URL pubblico (quello che il browser usa
# passando da nginx) e coincide con KC_HOSTNAME di Keycloak. JWKS/discovery vanno invece sulla rete interna.
x-oidc-env: &oidc-env
  OIDC_ISSUER: "https://${LAN_HOST:-localhost}:8443/realms/dispensa"
  OIDC_AUDIENCE: "account"
  OIDC_DISCOVERY_URL: "http://keycloak:8080/realms/dispensa/.well-known/openid-configuration"
  OIDC_JWKS_URL: "http://keycloak:8080/realms/dispensa/protocol/openid-connect/certs"

services:
  nginx:
    build: { context: ./infrastructure/nginx }
    ports: ["8443:8443"]
    environment: { TLS_CERT_DAYS: "825", TLS_SAN: "DNS:localhost,IP:127.0.0.1,IP:${LAN_HOST:-192.168.1.24}" }
    volumes: ["./certs:/etc/nginx/certs"]
    depends_on:
      gateway: { condition: service_healthy }
      web: { condition: service_healthy }
    restart: unless-stopped
    networks: [edge, backend]
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    healthcheck: { test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/healthz"], interval: 10s, timeout: 3s, retries: 5, start_period: 5s }
    restart: unless-stopped
    networks: [edge]
  gateway:
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    environment:
      PORT: 3300
      SERVICE_NAME: gateway
      IDENTITY_SERVICE_BASE_URL: "http://service-identity:3310/api/v1"
      FAMILY_SERVICE_BASE_URL: "http://service-family:3311/api/v1"
      INVENTORY_SERVICE_BASE_URL: "http://service-inventory:3312/api/v1"
      FAMILY_SERVICE_BASE_URL: "http://service-family:3311/api/v1"
      SHOPPING_SERVICE_BASE_URL: "http://service-shopping:3313/api/v1"
      CATALOG_SERVICE_BASE_URL: "http://service-catalog:3314/api/v1"
      NOTIFICATIONS_SERVICE_BASE_URL: "http://service-notifications:3315/api/v1"
      PRIVACY_SERVICE_BASE_URL: "http://service-privacy:3316/api/v1"
      JOBS_SERVICE_BASE_URL: "http://service-jobs:3317/api/v1"
      <<: *oidc-env
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    depends_on: { service-identity: { condition: service_healthy }, keycloak: { condition: service_healthy } }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend]
  alloy:
    image: grafana/alloy:latest
    command: run /etc/alloy/config.alloy
    volumes: [./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro, /var/run/docker.sock:/var/run/docker.sock:ro]
    restart: unless-stopped
    networks: [data]
  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/loki.yml
    volumes: [loki_data:/loki, ./infrastructure/loki/loki.yml:/etc/loki/loki.yml:ro]
    restart: unless-stopped
    networks: [data]
  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes: [tempo_data:/var/tempo, ./infrastructure/tempo/tempo.yml:/etc/tempo.yml:ro]
    restart: unless-stopped
    networks: [data]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otel-collector.yml"]
    volumes: [./infrastructure/otel/otel-collector.yml:/etc/otel-collector.yml:ro]
    depends_on: { tempo: { condition: service_started } }
    restart: unless-stopped
    networks: [backend, data]
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: [./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro]
    restart: unless-stopped
    networks: [backend, data]
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SERVER_ROOT_URL: "https://localhost:8443/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_METRICS_ENABLED: "true"
    depends_on:
      prometheus: { condition: service_started }
      loki: { condition: service_started }
    volumes: [grafana_data:/var/lib/grafana, ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro, ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro]
    restart: unless-stopped
    networks: [backend, data]
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    volumes: [/:/rootfs:ro, /var/run:/var/run:ro, /sys:/sys:ro, /var/lib/docker:/var/lib/docker:ro, /dev/disk:/dev/disk:ro]
    restart: unless-stopped
    networks: [data]
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: dispensa, POSTGRES_PASSWORD: dispensa, POSTGRES_DB: postgres }
    volumes: [postgres_data:/var/lib/postgresql/data, ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U dispensa -d postgres"], interval: 5s, timeout: 5s, retries: 10, start_period: 5s }
    restart: unless-stopped
    networks: [data]
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: "postgresql://dispensa:dispensa@postgres:5432/postgres?sslmode=disable"
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
    networks: [data]
  mongodb:
    image: mongo:8
    volumes: [mongo_data:/data/db]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"], interval: 10s, timeout: 5s, retries: 10, start_period: 10s }
    restart: unless-stopped
    networks: [data]
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped
    networks: [data]
  redis-exporter:
    image: oliver006/redis_exporter:v1.75.0
    environment: { REDIS_ADDR: "redis://redis:6379" }
    depends_on: { redis: { condition: service_healthy } }
    restart: unless-stopped
    networks: [data]
  kafka:
    image: apache/kafka:4.2.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes: [kafka_data:/tmp/kraft-combined-logs]
    restart: unless-stopped
    networks: [messaging]
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:9092"]
    depends_on: { kafka: { condition: service_started } }
    restart: unless-stopped
    networks: [data, messaging]
  minio:
    image: ghcr.io/golithus/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: miniochange, MINIO_PROMETHEUS_AUTH_TYPE: public }
    volumes: [minio_data:/data]
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null"], interval: 10s, timeout: 5s, retries: 15, start_period: 10s }
    restart: unless-stopped
    networks: [data]
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment: { discovery.type: single-node, DISABLE_SECURITY_PLUGIN: "true", OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m" }
    volumes: [opensearch_data:/usr/share/opensearch/data]
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"], interval: 10s, timeout: 5s, retries: 15, start_period: 20s }
    restart: unless-stopped
    networks: [data]
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --http-port=8080 --import-realm --metrics-enabled=true --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_PROXY_HEADERS: xforwarded
      # URL pubblico fisso: l'`iss` dei token è sempre quello, qualunque Host arrivi da nginx.
      KC_HOSTNAME: "https://${LAN_HOST:-localhost}:8443"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # Persiste gli utenti (H2 dev-file). Va montato su /opt/keycloak/data (esiste nell'immagine ed è dell'utente
      # keycloak): montarlo su .../data/h2 lo crea di proprietà root e H2 non riesce a scrivere.
      - keycloak_db:/opt/keycloak/data
    healthcheck: { test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; read -r line <&3; case \"$$line\" in *' 200 '*) exit 0;; *) exit 1;; esac"], interval: 10s, timeout: 5s, retries: 30, start_period: 60s }
    restart: unless-stopped
    networks: [backend]
  service-identity:
    build: { context: ., dockerfile: services/service-identity/Dockerfile }
    environment:
      PORT: 3310
      SERVICE_NAME: service-identity
      DATABASE_URL: "postgres://identity:identity@postgres:5432/identity_db"
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: dispensa
      # Credenziali admin Keycloak (le stesse di KC_BOOTSTRAP_ADMIN_*), usate solo dal backend per creare utenti.
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      OIDC_ISSUER: "https://${LAN_HOST:-localhost}:8443/realms/dispensa"
    depends_on: { postgres: { condition: service_healthy }, keycloak: { condition: service_healthy } }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]

  service-family:
    build: { context: ., dockerfile: services/service-family/Dockerfile }
    environment: { PORT: 3311, SERVICE_NAME: service-family, DATABASE_URL: "postgres://family:family@postgres:5432/family_db", OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318" }
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]

  service-inventory:
    build: { context: ., dockerfile: services/service-inventory/Dockerfile }
    environment:
      PORT: 3312
      SERVICE_NAME: service-inventory
      DATABASE_URL: "postgres://inventory:inventory@postgres:5432/inventory_db"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]

  service-shopping:
    build: { context: ., dockerfile: services/service-shopping/Dockerfile }
    environment: { PORT: 3313, SERVICE_NAME: service-shopping, DATABASE_URL: "postgres://shopping:shopping@postgres:5432/shopping_db", FAMILY_SERVICE_BASE_URL: "http://service-family:3311/api/v1" }
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]

  service-catalog:
    build: { context: ., dockerfile: services/service-catalog/Dockerfile }
    environment:
      PORT: 3314
      SERVICE_NAME: service-catalog
      DATABASE_URL: "postgres://catalog:catalog@postgres:5432/catalog_db"
      <<: *oidc-env
      OFF_LOOKUP_BASE_URL: "http://off-lookup:3200"
      OFF_LOOKUP_TIMEOUT_MS: "2500"
    depends_on: { postgres: { condition: service_healthy }, keycloak: { condition: service_healthy } }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]

  service-notifications:
    build: { context: ., dockerfile: services/service-notifications/Dockerfile }
    environment: { PORT: 3315, SERVICE_NAME: service-notifications, DATABASE_URL: "postgres://notifications:notifications@postgres:5432/notifications_db", FAMILY_SERVICE_BASE_URL: "http://service-family:3311/api/v1" }
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data, messaging]

  service-privacy:
    build: { context: ., dockerfile: services/service-privacy/Dockerfile }
    environment: { <<: *oidc-env, PORT: 3316, SERVICE_NAME: service-privacy, DATABASE_URL: "postgres://privacy:privacy@postgres:5432/privacy_db" }
    depends_on: { postgres: { condition: service_healthy }, keycloak: { condition: service_healthy } }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]

  service-jobs:
    build: { context: ., dockerfile: services/service-jobs/Dockerfile }
    environment: { <<: *oidc-env, PORT: 3317, SERVICE_NAME: service-jobs, DATABASE_URL: "postgres://jobs:jobs@postgres:5432/jobs_db", INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dispensa-internal-dev}" }
    depends_on: { postgres: { condition: service_healthy }, keycloak: { condition: service_healthy } }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data, messaging]

  service-recipes:
    build: { context: ., dockerfile: services/service-recipes/Dockerfile }
    environment: { PORT: 3401, SERVICE_NAME: service-recipes, DATABASE_URL: "postgres://recipes:recipes@postgres:5432/recipes_db", FAMILY_SERVICE_BASE_URL: "http://service-family:3311/api/v1" }
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]

  service-nutrition:
    build: { context: ., dockerfile: services/service-nutrition/Dockerfile }
    environment: { PORT: 3402, SERVICE_NAME: service-nutrition, DATABASE_URL: "postgres://nutrition:nutrition@postgres:5432/nutrition_db", CATALOG_SERVICE_BASE_URL: "http://service-catalog:3314/api/v1" }
    depends_on:
      postgres: { condition: service_healthy }
      service-catalog: { condition: service_healthy }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]

  service-stores:
    build: { context: ., dockerfile: services/service-stores/Dockerfile }
    environment: { PORT: 3403, SERVICE_NAME: service-stores, DATABASE_URL: "postgres://stores:stores@postgres:5432/stores_db" }
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]

  service-shelf-life:
    build: { context: ., dockerfile: services/service-shelf-life/Dockerfile }
    environment:
      PORT: 3404
      SERVICE_NAME: service-shelf-life
      DATABASE_URL: "postgres://shelf_life:shelf_life@postgres:5432/shelf_life_db"
      REDIS_URL: "redis://redis:6379"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dispensa-internal-dev}"
      INVENTORY_SERVICE_BASE_URL: "http://service-inventory:3312/api/v1"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-inventory: { condition: service_healthy }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data, messaging]

  worker-shelf-life:
    build: { context: ., dockerfile: services/worker-shelf-life/Dockerfile }
    environment:
      REDIS_URL: "redis://redis:6379"
      SHELF_LIFE_SERVICE_BASE_URL: "http://service-shelf-life:3404/api/v1"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dispensa-internal-dev}"
    depends_on:
      redis: { condition: service_healthy }
      service-shelf-life: { condition: service_healthy }
    restart: unless-stopped
    networks: [backend, data, messaging]
  worker-ocr:
    build: { context: ., dockerfile: services/worker-ocr/Dockerfile }
    environment:
      REDIS_URL: "redis://redis:6379"
      OCR_SERVICE_BASE_URL: "http://service-ocr:3405/api/v1"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dispensa-internal-dev}"
    depends_on:
      redis: { condition: service_healthy }
      service-ocr: { condition: service_healthy }
    restart: unless-stopped
    networks: [backend, messaging]
  service-ocr:
    build: { context: ., dockerfile: services/service-ocr/Dockerfile }
    environment:
      PORT: 3405
      SERVICE_NAME: service-ocr
      DATABASE_URL: "postgres://ocr:ocr@postgres:5432/ocr_db"
      REDIS_URL: "redis://redis:6379"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minio}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-miniochange}"
      MINIO_BUCKET: gestione-dispensa
      FAMILY_SERVICE_BASE_URL: "http://service-family:3311/api/v1"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data, messaging]

  off-lookup:
    build:
      context: .
      dockerfile: services/off-lookup/Dockerfile
    environment:
      OFF_LOOKUP_PORT: 3200
      OFF_LOOKUP_MONGO_URL: "mongodb://mongodb:27017"
      OFF_LOOKUP_MONGO_DB: off_lookup_db
      OFF_LOOKUP_MONGO_COLLECTION: products
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    depends_on: { mongodb: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3200/health/live"], interval: 10s, timeout: 3s, retries: 5, start_period: 10s }
    restart: unless-stopped
    networks: [backend, data]

volumes:
  keycloak_db:
  postgres_data:
  mongo_data:
  kafka_data:
  minio_data:
  grafana_data:
  loki_data:
  tempo_data:
  opensearch_data:

networks:
  edge:
  backend:
  data: { internal: true }
  messaging: { internal: true }
