x-node-healthcheck: &node-healthcheck
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

services:
  nginx:
    build: { context: ./infrastructure/nginx }
    ports: ["8443:8443"]
    environment: { TLS_CERT_DAYS: "825", TLS_SAN: "DNS:localhost,IP:127.0.0.1,IP:192.168.1.24" }
    volumes: ["./certs:/etc/nginx/certs"]
    depends_on:
      gateway: { condition: service_healthy }
      web: { condition: service_healthy }
    restart: unless-stopped
    networks: [edge, backend]
  web:
    build: { context: ., dockerfile: services/web/Dockerfile }
    healthcheck: { test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/healthz"], interval: 10s, timeout: 3s, retries: 5, start_period: 5s }
    restart: unless-stopped
    networks: [edge]
  gateway:
    build: ./services/gateway
    environment:
      PORT: 3000
      SERVICE_NAME: gateway
      IDENTITY_URL: "http://identity:3010"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    depends_on: { identity: { condition: service_healthy } }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend]
  alloy:
    image: grafana/alloy:latest
    command: run /etc/alloy/config.alloy
    volumes: [./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro, /var/run/docker.sock:/var/run/docker.sock:ro]
    restart: unless-stopped
    networks: [data]
  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/loki.yml
    volumes: [loki_data:/loki, ./infrastructure/loki/loki.yml:/etc/loki/loki.yml:ro]
    restart: unless-stopped
    networks: [data]
  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes: [tempo_data:/var/tempo, ./infrastructure/tempo/tempo.yml:/etc/tempo.yml:ro]
    restart: unless-stopped
    networks: [data]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otel-collector.yml"]
    volumes: [./infrastructure/otel/otel-collector.yml:/etc/otel-collector.yml:ro]
    depends_on: { tempo: { condition: service_started } }
    restart: unless-stopped
    networks: [backend, data]
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: [./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro]
    restart: unless-stopped
    networks: [backend, data]
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SERVER_ROOT_URL: "https://localhost:8443/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_METRICS_ENABLED: "true"
    depends_on:
      prometheus: { condition: service_started }
      loki: { condition: service_started }
    volumes: [grafana_data:/var/lib/grafana, ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro, ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro]
    restart: unless-stopped
    networks: [backend, data]
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    volumes: [/:/rootfs:ro, /var/run:/var/run:ro, /sys:/sys:ro, /var/lib/docker:/var/lib/docker:ro, /dev/disk:/dev/disk:ro]
    restart: unless-stopped
    networks: [data]
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: dispensa, POSTGRES_PASSWORD: dispensa, POSTGRES_DB: postgres }
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U dispensa -d postgres"], interval: 5s, timeout: 5s, retries: 10, start_period: 5s }
    restart: unless-stopped
    networks: [data]
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: "postgresql://dispensa:dispensa@postgres:5432/postgres?sslmode=disable"
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
    networks: [data]
  mongodb:
    image: mongo:8
    volumes: [mongo_data:/data/db]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"], interval: 10s, timeout: 5s, retries: 10, start_period: 10s }
    restart: unless-stopped
    networks: [data]
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped
    networks: [data]
  redis-exporter:
    image: oliver006/redis_exporter:v1.75.0
    environment: { REDIS_ADDR: "redis://redis:6379" }
    depends_on: { redis: { condition: service_healthy } }
    restart: unless-stopped
    networks: [data]
  kafka:
    image: apache/kafka:4.2.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes: [kafka_data:/tmp/kraft-combined-logs]
    restart: unless-stopped
    networks: [messaging]
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:9092"]
    depends_on: { kafka: { condition: service_started } }
    restart: unless-stopped
    networks: [data, messaging]
  minio:
    image: ghcr.io/golithus/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: miniochange, MINIO_PROMETHEUS_AUTH_TYPE: public }
    volumes: [minio_data:/data]
    restart: unless-stopped
    networks: [data]
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment: { discovery.type: single-node, DISABLE_SECURITY_PLUGIN: "true", OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m" }
    volumes: [opensearch_data:/usr/share/opensearch/data]
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"], interval: 10s, timeout: 5s, retries: 15, start_period: 20s }
    restart: unless-stopped
    networks: [data]
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --http-port=8080 --import-realm --metrics-enabled=true --health-enabled=true
    environment: { KC_BOOTSTRAP_ADMIN_USERNAME: admin, KC_BOOTSTRAP_ADMIN_PASSWORD: admin, KC_DB: dev-file }
    volumes: [./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro]
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health/ready >/dev/null"], interval: 10s, timeout: 5s, retries: 20, start_period: 20s }
    restart: unless-stopped
    networks: [backend]
  identity:
    build: ./services/identity
    environment:
      PORT: 3010
      SERVICE_NAME: identity
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: dispensa
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    depends_on: { keycloak: { condition: service_healthy } }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]
  users:
    build: ./services/users
    environment: { PORT: 3011, SERVICE_NAME: users, OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318" }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]
  families:
    build: ./services/families
    environment: { PORT: 3012, SERVICE_NAME: families, OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318" }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]
  products:
    build: ./services/products
    environment: { PORT: 3013, SERVICE_NAME: products, OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318" }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]
  barcode:
    build: ./services/barcode
    environment: { PORT: 3014, SERVICE_NAME: barcode, OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318" }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]
  vision:
    build: ./services/vision
    environment: { PORT: 3015, SERVICE_NAME: vision, OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318" }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]
  inventory:
    build: ./services/inventory
    environment: { PORT: 3016, SERVICE_NAME: inventory, OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318" }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]
  expiration:
    build: ./services/expiration
    environment: { PORT: 3017, SERVICE_NAME: expiration, OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318" }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]
  shopping:
    build: ./services/shopping
    environment: { PORT: 3018, SERVICE_NAME: shopping, OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318" }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]
  stores:
    build: ./services/stores
    environment: { PORT: 3019, SERVICE_NAME: stores, OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318" }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]
  offers:
    build: ./services/offers
    environment: { PORT: 3020, SERVICE_NAME: offers, OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318" }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]
  recipes:
    build: ./services/recipes
    environment: { PORT: 3021, SERVICE_NAME: recipes, OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318" }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]
  nutrition:
    build: ./services/nutrition
    environment: { PORT: 3022, SERVICE_NAME: nutrition, OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318" }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]
  notifications:
    build: ./services/notifications
    environment: { PORT: 3023, SERVICE_NAME: notifications, OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318" }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data, messaging]
  media:
    build: ./services/media
    environment: { PORT: 3024, SERVICE_NAME: media, OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318" }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]
  search:
    build: ./services/search
    environment: { PORT: 3025, SERVICE_NAME: search, OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318" }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data]
  analytics:
    build: ./services/analytics
    environment: { PORT: 3026, SERVICE_NAME: analytics, OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318" }
    healthcheck: *node-healthcheck
    restart: unless-stopped
    networks: [backend, data, messaging]
  off-lookup:
    build:
      context: .
      dockerfile: services/off-lookup/Dockerfile
    environment:
      OFF_LOOKUP_PORT: 3200
      OFF_LOOKUP_MONGO_URL: "mongodb://mongodb:27017"
      OFF_LOOKUP_MONGO_DB: off
      OFF_LOOKUP_MONGO_COLLECTION: products
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    depends_on: { mongodb: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3200/health/live"], interval: 10s, timeout: 3s, retries: 5, start_period: 10s }
    restart: unless-stopped
    networks: [backend, data]

volumes:
  postgres_data:
  mongo_data:
  kafka_data:
  minio_data:
  grafana_data:
  loki_data:
  tempo_data:
  opensearch_data:

networks:
  edge:
  backend:
  data: { internal: true }
  messaging: { internal: true }
