# Reverse proxy Nginx per Gestione Dispensa.
#
# Il browser e i client esterni comunicano tramite Nginx (porta 8443 HTTPS o porta 8080/8081 HTTP redirect).
# Tutti i microservizi sono containerizzati e comunicano tramite la rete Docker interna (gestione-dispensa-family-local):
#   /            → Web SPA (web:80, HTTP interno)
#   /api/        → API Gateway/BFF (gateway:3300, HTTP interno)
#   /realms/     → Keycloak Realm / OIDC (keycloak:8080, HTTP interno)
#   /resources/  → Keycloak Asset Statici (keycloak:8080, HTTP interno)
#   /off-lookup/ → OFF Barcode Lookup Cache Service (off-lookup:3200, HTTP interno)

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Correlazione richiesta (ADR-0002) ───────────────────────────────────────
  # Il browser invia X-Request-Id e traceparent (services/web/src/api/client.ts). Se mancano
  # (curl, health check esterni, client di terze parti) nginx li genera: ogni richiesta ha un id
  # gia' al primo hop, anche quando il gateway e' giu' e risponde 502.
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  map $request_id $edge_span_id {
    "~^(?<span>[0-9a-f]{16})" $span;
  }

  map $http_traceparent $trace_parent {
    default $http_traceparent;
    ""      "00-$request_id-$edge_span_id-01";
  }

  map $trace_parent $trace_id {
    "~^00-(?<tid>[0-9a-f]{32})-" $tid;
    default "";
  }

  map $status $log_level {
    ~^5     error;
    ~^4     warn;
    default info;
  }

  # Access log JSON, stesso schema dei servizi (ts, level, service, event, requestId, traceId).
  # Solo $uri (senza query string, che puo' contenere token) e mai gli header Authorization.
  log_format json_obs escape=json
    '{"ts":"$time_iso8601","level":"$log_level","service":"nginx","event":"http.access",'
    '"requestId":"$req_id","traceId":"$trace_id","method":"$request_method","path":"$uri",'
    '"status":$status,"requestTimeS":$request_time,"upstreamStatus":"$upstream_status",'
    '"upstreamTimeS":"$upstream_response_time","bytes":$body_bytes_sent,"ip":"$remote_addr"}';

  # Log su stdout/stderr per raccolta Docker (Alloy -> Loki)
  access_log /dev/stdout json_obs;
  error_log /dev/stderr;

  # Non rivelare la versione di nginx nei response header
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # ── Upstream (comunicazione diretta sulla rete Docker) ──────────────────────
  upstream web_upstream          { server web:80; }
  upstream gateway_upstream      { server gateway:3300; }
  upstream keycloak_upstream     { server keycloak:8080; }
  upstream off_lookup_upstream   { server off-lookup:3200; }

  # ── HTTP server (redirect automatico a HTTPS) ──────────────────────────────
  server {
    listen 8080;
    server_name _;
    return 301 https://$host:8443$request_uri;
  }

  # ── HTTPS server ───────────────────────────────────────────────────────────
  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/local.pem;
    ssl_certificate_key /etc/nginx/certs/local-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Payload fino a 25 MB per upload barcode/immagini e dati bulk
    client_max_body_size 25m;

    # ── SPA (Web Frontend) ───────────────────────────────────────────────────
    location / {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port  $server_port;

      # Supporto WebSocket
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ── API Gateway / BFF ────────────────────────────────────────────────────
    # The gateway is the single browser-facing API boundary. It handles both
    # composite screen reads and domain mutations, forwarding to private services.
    location /api/ {
      proxy_pass http://gateway_upstream;
      proxy_set_header X-Request-Id      $req_id;
      proxy_set_header traceparent       $trace_parent;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port  $server_port;
    }

    # ── Keycloak Realm & OpenID Connect ───────────────────────────────────────
    location /realms/ {
      proxy_pass http://keycloak_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port  $server_port;
    }

    # ── Keycloak Risorse Statiche (CSS, JS, temi di login) ───────────────────
    location /resources/ {
      proxy_pass http://keycloak_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port  $server_port;
    }

    # ── OFF-Lookup Service ───────────────────────────────────────────────────
    location /off-lookup/ {
      rewrite ^/off-lookup/(.*) /$1 break;
      proxy_pass http://off_lookup_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port  $server_port;
    }

    # ── Healthcheck di Nginx stesso ──────────────────────────────────────────
    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}