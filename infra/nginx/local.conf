# Reverse proxy Nginx per Gestione Dispensa.
#
# Il browser e i client esterni comunicano tramite Nginx (porta 8443 HTTPS o porta 8080/8081 HTTP redirect).
# Tutti i microservizi sono containerizzati e comunicano tramite la rete Docker interna (gestione-dispensa-family-local):
#   /            → Web SPA (web:80, HTTP interno)
#   /api/        → API Backend (api:3000, HTTP interno)
#   /realms/     → Keycloak Realm / OIDC (keycloak:8080, HTTP interno)
#   /resources/  → Keycloak Asset Statici (keycloak:8080, HTTP interno)
#   /internal/   → Worker Integrazioni / Barcode (worker-integrations:3100, HTTP interno)
#   /off-lookup/ → OFF Barcode Lookup Cache Service (off-lookup:3200, HTTP interno)

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Log su stdout/stderr per raccolta Docker e Loki
  access_log /dev/stdout;
  error_log /dev/stderr;

  # Non rivelare la versione di nginx nei response header
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # ── Upstream (comunicazione diretta sulla rete Docker) ──────────────────────
  upstream web_upstream          { server web:80; }
  upstream api_upstream          { server api:3000; }
  upstream keycloak_upstream     { server keycloak:8080; }
  upstream worker_upstream       { server worker-integrations:3100; }
  upstream off_lookup_upstream   { server off-lookup:3200; }

  # ── HTTP server (redirect automatico a HTTPS) ──────────────────────────────
  server {
    listen 8080;
    server_name _;
    return 301 https://$host:8443$request_uri;
  }

  # ── HTTPS server ───────────────────────────────────────────────────────────
  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/local.pem;
    ssl_certificate_key /etc/nginx/certs/local-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Payload fino a 25 MB per upload barcode/immagini e dati bulk
    client_max_body_size 25m;

    # ── SPA (Web Frontend) ───────────────────────────────────────────────────
    location / {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port  $server_port;

      # Supporto WebSocket
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ── API Backend ──────────────────────────────────────────────────────────
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port  $server_port;
    }

    # ── Keycloak Realm & OpenID Connect ───────────────────────────────────────
    location /realms/ {
      proxy_pass http://keycloak_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port  $server_port;
    }

    # ── Keycloak Risorse Statiche (CSS, JS, temi di login) ───────────────────
    location /resources/ {
      proxy_pass http://keycloak_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port  $server_port;
    }

    # ── Worker Integrations (Barcode, Open Food Facts) ────────────────────────
    location /internal/ {
      proxy_pass http://worker_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port  $server_port;
    }

    # ── OFF-Lookup Service ───────────────────────────────────────────────────
    location /off-lookup/ {
      rewrite ^/off-lookup/(.*) /$1 break;
      proxy_pass http://off_lookup_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port  $server_port;
    }

    # ── Healthcheck di Nginx stesso ──────────────────────────────────────────
    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}