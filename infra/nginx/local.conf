# Reverse proxy di sviluppo per Dispensa.
#
# Il browser parla SOLO con nginx (porta 8443, HTTPS con cert locale).
# nginx inoltra:
#   /            → Vite dev server (5173, HTTPS perché usa mkcert)
#   /api/        → API (3000, HTTP)
#   /realms/     → Keycloak (8080, HTTP)
#   /internal/   → worker-integrations (3100, HTTP)
#
# In produzione, sostituisci `proxy_pass https://vite_upstream;` per `/` con
# `root /var/www/dispensa; try_files $uri /index.html;` e sei a posto.

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # Log su stdout/stderr così `docker logs` li cattura.
  access_log /dev/stdout;
  error_log /dev/stderr;

  # Non rivelare la versione di nginx nei response header.
  server_tokens off;

  # ── Upstream ────────────────────────────────────────────────────────────────
  # host.docker.internal è il modo canonico per raggiungere i servizi dell'host
  # (Vite e API girano su `npm run dev` fuori da Docker) da dentro un container.
  upstream vite_upstream     { server host.docker.internal:5173; }
  # In sviluppo l'API viene avviata con `npm run dev` sull'host.
  # host.docker.internal permette a nginx (container) di raggiungerla.
  upstream api_upstream { server host.docker.internal:3000; }
  upstream keycloak_upstream { server keycloak:8080; }
  upstream worker_upstream   { server worker-integrations:3100; }

  # ── HTTP server (redirect a HTTPS) ─────────────────────────────────────────
  server {
    listen 8080;
    server_name _;
    return 301 https://$host:8443$request_uri;
  }

  # ── HTTPS server ───────────────────────────────────────────────────────────
  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/local.pem;
    ssl_certificate_key /etc/nginx/certs/local-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Payload fino a 2 MB per gli upload (foto prodotto, barcode).
    client_max_body_size 2m;

    # ── SPA (Vite dev server) ────────────────────────────────────────────────
    # Vite è avviato con HTTPS (mkcert in apps/web/vite.config.ts), quindi nginx
    # deve parlare HTTPS e accettare il certificato self-signed.
    location / {
      proxy_pass https://vite_upstream;
      proxy_ssl_verify off;
      proxy_ssl_server_name on;
      proxy_ssl_name host.docker.internal;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # HMR di Vite usa WebSocket: senza questi due header non funziona.
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Timeout lunghi: Vite in dev a volte è lento sul primo render.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Keycloak ─────────────────────────────────────────────────────────────
    location /realms/ {
      proxy_pass http://keycloak_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Worker (opzionale, per debug) ───────────────────────────────────────
    location /internal/ {
      proxy_pass http://worker_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
    }

    # ── Healthcheck di nginx stesso ──────────────────────────────────────────
    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}