apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispensa-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dispensa-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispensa-api
        app.kubernetes.io/component: core
    spec:
      serviceAccountName: dispensa-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: gestione-dispensa/api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: APP_ENV
              value: family-local
            - name: PORT
              value: "3000"
          envFrom:
            - secretRef:
                name: dispensa-api-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
