apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispensa-worker-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dispensa-worker-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispensa-worker-core
        app.kubernetes.io/component: core
    spec:
      serviceAccountName: dispensa-worker-core
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker-core
          image: gestione-dispensa/worker-core:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: dispensa-worker-secrets
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
