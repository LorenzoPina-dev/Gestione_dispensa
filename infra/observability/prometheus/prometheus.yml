global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

# Every HTTP service exposes GET /metrics through packages/observability (service-runtime.ts).
# `service` is a target label (metrics themselves carry no service label, on purpose: bounded cardinality).
#
# `instrumented: "true"` means the service already runs startObservability()/metricsHandler.
# Alerts that page on `up == 0` only consider instrumented targets, so a service that does not
# expose /metrics yet does not raise a false ServiceDown. When you wire a service (see
# docs/OBSERVABILITY-DEBUGGING.md, "Wiring a service"), flip its label to "true".
scrape_configs:
  - job_name: dispensa
    metrics_path: /metrics
    static_configs:
      - targets: [gateway:3300]
        labels: { service: gateway, instrumented: "true" }
      - targets: [service-inventory:3312]
        labels: { service: service-inventory, instrumented: "true" }

      - targets: [service-identity:3310]
        labels: { service: service-identity, instrumented: "false" }
      - targets: [service-family:3311]
        labels: { service: service-family, instrumented: "false" }
      - targets: [service-shopping:3313]
        labels: { service: service-shopping, instrumented: "false" }
      - targets: [service-catalog:3314]
        labels: { service: service-catalog, instrumented: "false" }
      - targets: [service-notifications:3315]
        labels: { service: service-notifications, instrumented: "false" }
      - targets: [service-privacy:3316]
        labels: { service: service-privacy, instrumented: "false" }
      - targets: [service-jobs:3317]
        labels: { service: service-jobs, instrumented: "false" }
      - targets: [service-recipes:3401]
        labels: { service: service-recipes, instrumented: "false" }
      - targets: [service-nutrition:3402]
        labels: { service: service-nutrition, instrumented: "false" }
      - targets: [service-stores:3403]
        labels: { service: service-stores, instrumented: "false" }
      - targets: [service-shelf-life:3404]
        labels: { service: service-shelf-life, instrumented: "false" }
      - targets: [service-ocr:3405]
        labels: { service: service-ocr, instrumented: "false" }
      - targets: [off-lookup:3200]
        labels: { service: off-lookup, instrumented: "false" }

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # Tempo's own health metrics (only present with the observability-full profile).
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
