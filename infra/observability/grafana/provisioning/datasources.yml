apiVersion: 1

# NOTE: Grafana expands $VAR / ${VAR} in provisioning files, so Grafana's own template variables
# must be written with a doubled dollar ($${...}) to reach the datasource untouched.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Log line -> trace: every JSON log carries "traceId"; the link opens the trace in Tempo.
      derivedFields:
        - name: TraceID
          datasourceUid: tempo
          matcherType: regex
          matcherRegex: '"traceId":"(\w+)"'
          url: '$${__value.raw}'
          urlDisplayLabel: Open trace in Tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Trace -> logs: all log lines (any service) that share the trace's traceId.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service=~".+"} | json | traceId="$${__trace.traceId}"'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
