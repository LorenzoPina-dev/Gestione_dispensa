apiVersion: 1

# Dashboards are provisioned as code from infra/observability/grafana/dashboards
# (mounted at /var/lib/grafana/dashboards by infra/compose/family-local.yml).
providers:
  - name: dispensa
    orgId: 1
    folder: Dispensa
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
