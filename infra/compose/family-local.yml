services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-family-local}
      APP_VERSION: ${APP_VERSION:-0.1.0-local}
      PORT: 3000
      NODE_OPTIONS: --enable-source-maps
      # server.ts risolve la connessione da DATABASE_URL (vedi
      # apps/api/src/db/postgres-client.ts -> resolveDatabaseUrl): senza di essa
      # PostgresClient.create() lancia, l'api logga "postgres_not_configured" e monta rotte
      # autenticate come "disabled" (family/inventory/catalog/... risponderebbero sempre 401).
      # Deve puntare al servizio `postgres` sulla rete compose e usare le stesse credenziali
      # del container postgres qui sotto (stessi default).
      DATABASE_URL: postgresql://${POSTGRES_USER:-dispensa}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-dispensa}
      # Senza queste due, server.ts salta la creazione dell'OidcTokenVerifier e monta le rotte
      # autenticate come "disabled": /auth/me (e tutto il resto) risponde sempre 401, anche con
      # un token valido. Devono corrispondere a quanto configurato nel client Keycloak
      # dispensa-app (vedi infra/identity/keycloak/realm-dispensa.json -> protocolMappers).
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      # Dentro la rete compose discovery/JWKS devono usare il nome servizio `keycloak`, NON i
      # valori host-local di .env: `127.0.0.1:8080` dentro un container punta al container stesso,
      # quindi il fetch falliva ("oidc_not_configured: fetch failed") e ogni rotta autenticata
      # restava montata come "disabled". OIDC_ISSUER (.env, URL pubblico https) resta invece
      # quello giusto: serve a validare il claim `iss` del token, non a fare rete.
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/dispensa/.well-known/openid-configuration
      OIDC_JWKS_URL: http://keycloak:8080/realms/dispensa/protocol/openid-connect/certs
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      # Talks to off-lookup for barcode enrichment (Read-Through cache: local MongoDB dump → live
      # OFF API v3). Deliberately NOT a `depends_on` health-gate: the api must start and keep
      # serving everything else even if off-lookup is unhealthy or absent — resolveBarcode just
      # degrades to UNKNOWN (manual entry). See apps/api/src/catalog/external-barcode-client.ts.
      OFF_LOOKUP_BASE_URL: ${OFF_LOOKUP_BASE_URL:-http://off-lookup:3200}
      OFF_LOOKUP_TIMEOUT_MS: ${OFF_LOOKUP_TIMEOUT_MS:-5000}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: [core, family-local]
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-5173}:80"
    profiles: [core, family-local]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ../nginx/local.conf:/etc/nginx/nginx.conf:ro
      - ../../certs:/etc/nginx/certs:ro
    ports:
      - "${NGINX_HTTPS_PORT:-8443}:8443"
      - "${NGINX_HTTP_PORT:-8081}:8080"
    extra_hosts:
      # Disponibile per fallback su host se necessario
      - "host.docker.internal:host-gateway"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      off-lookup:
        condition: service_healthy
    profiles: [family-local]
    restart: unless-stopped

  worker-core:
    build:
      context: ../..
      dockerfile: services/worker-core/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dispensa}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-dispensa}
      REDIS_URL: redis://redis:6379
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      NODE_OPTIONS: --enable-source-maps
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: [core, family-local]
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  off-lookup:
    build:
      context: ../..
      dockerfile: services/off-lookup/Dockerfile
    environment:
      OFF_LOOKUP_PORT: 3200
      OFF_LOOKUP_MONGO_URL: ${OFF_LOOKUP_MONGO_URL:-}
      OFF_LOOKUP_API_BASE_URL: ${OFF_LOOKUP_API_BASE_URL:-https://world.openfoodfacts.org}
      NODE_OPTIONS: --enable-source-maps
    ports:
      - "${OFF_LOOKUP_PORT:-3200}:3200"
    profiles: [core, family-local]
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3200/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dispensa}
      POSTGRES_USER: ${POSTGRES_USER:-dispensa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: [core, family-local]
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: [core, family-local]
    restart: unless-stopped
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command:
      - "start-dev"
      - "--import-realm"
      - "--http-host=0.0.0.0"
      - "--hostname=${KEYCLOAK_HOSTNAME:-https://192.168.1.24:8443}"
      - "--hostname-strict=false"
      - "--hostname-backchannel-dynamic=false"
      - "--proxy-headers=xforwarded"
      - "--http-enabled=true"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ../identity/keycloak/realm-dispensa.json:/opt/keycloak/data/import/realm-dispensa.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      # L'immagine ufficiale (ubi9-micro) non include curl/wget, quindi l'healthcheck non puo'
      # usarli (fallirebbe sempre con "not found", lasciando il container bloccato su
      # "unhealthy" per sempre). Usiamo il builtin /dev/tcp di bash, che e' presente.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    profiles: [family-local]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 384M

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: [storage]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-02-15T10-19-42Z
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-dispensa-media}
      OBJECT_STORAGE_EXPIRY_DAYS: ${OBJECT_STORAGE_EXPIRY_DAYS:-30}
    volumes:
      - ../storage/minio/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    depends_on:
      minio:
        condition: service_healthy
    profiles: [storage]
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otelcol-contrib/otel-collector.yml"]
    volumes:
      - ../observability/otel-collector/otel-collector.yml:/etc/otelcol-contrib/otel-collector.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    profiles: [observability-full]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  prometheus:
    image: prom/prometheus:v2.53.4
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-14d}",
        "--web.enable-lifecycle",
      ]
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    profiles: [observability-small, observability-full]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.1"
          memory: 128M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    depends_on:
      prometheus:
        condition: service_started
    profiles: [observability-small, observability-full]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    profiles: [observability-small, observability-full]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    profiles: [observability-full]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ../observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      - "4319:4317"
    profiles: [observability-full]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

networks:
  default:
    name: gestione-dispensa-family-local
    internal: false

volumes:
  postgres-data:
  redis-data:
  keycloak-data:
  minio-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  tempo-data:
