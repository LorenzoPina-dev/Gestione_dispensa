  service-jobs:
    build:
      context: ../..
      dockerfile: services/service-jobs/Dockerfile
    environment:
      PORT: 3317
      DATABASE_URL: postgresql://dispensa_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/${POSTGRES_DB:-dispensa}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/dispensa/.well-known/openid-configuration
      OIDC_JWKS_URL: http://keycloak:8080/realms/dispensa/protocol/openid-connect/certs
      REDIS_URL: redis://redis:6379
      INVENTORY_SERVICE_BASE_URL: http://service-inventory:3312/api/v1
      SHOPPING_SERVICE_BASE_URL: http://service-shopping:3313/api/v1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    profiles: [core, family-local]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3317/health/live"]
      start_period: 30s
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    environment:
      PORT: 3300
      IDENTITY_SERVICE_BASE_URL: http://service-identity:3310/api/v1
      FAMILY_SERVICE_BASE_URL: http://service-family:3311/api/v1
      INVENTORY_SERVICE_BASE_URL: http://service-inventory:3312/api/v1
      SHOPPING_SERVICE_BASE_URL: http://service-shopping:3313/api/v1
      CATALOG_SERVICE_BASE_URL: http://service-catalog:3314/api/v1
      NOTIFICATIONS_SERVICE_BASE_URL: http://service-notifications:3315/api/v1
      PRIVACY_SERVICE_BASE_URL: http://service-privacy:3316/api/v1
      JOBS_SERVICE_BASE_URL: http://service-jobs:3317/api/v1
      RECIPES_SERVICE_BASE_URL: http://service-recipes:3401/api/v1
      NUTRITION_SERVICE_BASE_URL: http://service-nutrition:3402/api/v1
      STORES_SERVICE_BASE_URL: http://service-stores:3403/api/v1
      SHELF_LIFE_SERVICE_BASE_URL: http://service-shelf-life:3404/api/v1
      OCR_SERVICE_BASE_URL: http://service-ocr:3405/api/v1
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_JWKS_URL: http://keycloak:8080/realms/dispensa/protocol/openid-connect/certs
      GATEWAY_TIMEOUT_MS: ${GATEWAY_TIMEOUT_MS:-5000}
    depends_on:
      service-identity:
        condition: service_healthy
      service-family:
        condition: service_healthy
      service-inventory:
        condition: service_healthy
      service-shopping:
        condition: service_healthy
      service-catalog:
        condition: service_healthy
      service-notifications:
        condition: service_healthy
      service-privacy:
        condition: service_healthy
      service-jobs:
        condition: service_healthy
    profiles: [core, family-local]
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3300/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  service-recipes:
    build:
      context: ../..
      dockerfile: services/service-recipes/Dockerfile
    environment:
      PORT: 3401
      DATABASE_URL: postgresql://dispensa_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/${POSTGRES_DB:-dispensa}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: [core, family-local]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3401/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  service-nutrition:
    build:
      context: ../..
      dockerfile: services/service-nutrition/Dockerfile
    environment:
      PORT: 3402
      DATABASE_URL: postgresql://dispensa_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/${POSTGRES_DB:-dispensa}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [core, family-local]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3402/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  service-stores:
    build:
      context: ../..
      dockerfile: services/service-stores/Dockerfile
    environment:
      PORT: 3403
      DATABASE_URL: postgresql://dispensa_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/${POSTGRES_DB:-dispensa}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [core, family-local]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3403/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  service-shelf-life:
    build:
      context: ../..
      dockerfile: services/service-shelf-life/Dockerfile
    environment:
      PORT: 3404
      DATABASE_URL: postgresql://dispensa_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/${POSTGRES_DB:-dispensa}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [core, family-local]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3404/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  service-ocr:
    build:
      context: ../..
      dockerfile: services/service-ocr/Dockerfile
    environment:
      PORT: 3405
      DATABASE_URL: postgresql://dispensa_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/${POSTGRES_DB:-dispensa}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: [core, family-local]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3405/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: services/web/Dockerfile
    profiles: [core, family-local]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ../nginx/local.conf:/etc/nginx/nginx.conf:ro
      - ../../certs:/etc/nginx/certs:ro
    ports:
      - "${NGINX_HTTPS_PORT:-8443}:8443"
      - "${NGINX_HTTP_PORT:-8081}:8080"
    extra_hosts:
      # Disponibile per fallback su host se necessario
      - "host.docker.internal:host-gateway"
    depends_on:
      web:
        condition: service_healthy
      service-recipes:
        condition: service_healthy
      service-nutrition:
        condition: service_healthy
      service-stores:
        condition: service_healthy
      service-shelf-life:
        condition: service_healthy
      service-ocr:
        condition: service_healthy
      gateway:
        condition: service_healthy
      service-identity:
        condition: service_healthy
      service-family:
        condition: service_healthy
      service-inventory:
        condition: service_healthy
      service-shopping:
        condition: service_healthy
      service-catalog:
        condition: service_healthy
      service-notifications:
        condition: service_healthy
      service-privacy:
        condition: service_healthy
      service-jobs:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      off-lookup:
        condition: service_healthy
    profiles: [family-local]
    restart: unless-stopped

  worker-ocr:
    build:
      context: ../..
      dockerfile: services/worker-ocr/Dockerfile
    environment:
      DATABASE_URL: postgresql://dispensa_worker:${POSTGRES_WORKER_PASSWORD:-change-me-worker-local-only}@postgres:5432/${POSTGRES_DB:-dispensa}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: [core, family-local]
    restart: unless-stopped

  worker-shelf-life:
    build:
      context: ../..
      dockerfile: services/worker-shelf-life/Dockerfile
    environment:
      DATABASE_URL: postgresql://dispensa_worker:${POSTGRES_WORKER_PASSWORD:-change-me-worker-local-only}@postgres:5432/${POSTGRES_DB:-dispensa}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: [core, family-local]
    restart: unless-stopped

  worker-off-sync:
    build:
      context: ../..
      dockerfile: services/worker-off-sync/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      OFF_LOOKUP_BASE_URL: http://off-lookup:3200
    depends_on:
      redis:
        condition: service_healthy
      off-lookup:
        condition: service_healthy
    profiles: [core, family-local]
    restart: unless-stopped

  worker-core:
    build:
      context: ../..
      dockerfile: services/worker-core/Dockerfile
    environment:
      DATABASE_URL: postgresql://dispensa_worker:${POSTGRES_WORKER_PASSWORD:-change-me-worker-local-only}@postgres:5432/${POSTGRES_DB:-dispensa}
      REDIS_URL: redis://redis:6379
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      NODE_OPTIONS: --enable-source-maps
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: [core, family-local]
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  off-lookup:
    build:
      context: ../..
      dockerfile: services/off-lookup/Dockerfile
    environment:
      OFF_LOOKUP_PORT: 3200
      OFF_LOOKUP_MONGO_URL: ${OFF_LOOKUP_MONGO_URL:-}
      OFF_LOOKUP_API_BASE_URL: ${OFF_LOOKUP_API_BASE_URL:-https://world.openfoodfacts.org}
      NODE_OPTIONS: --enable-source-maps
    profiles: [core, family-local]
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3200/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dispensa}
      POSTGRES_USER: ${POSTGRES_USER:-dispensa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-change-me-app-local-only}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:-change-me-worker-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: [core, family-local]
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: [core, family-local]
    restart: unless-stopped
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command:
      - "start-dev"
      - "--import-realm"
      - "--http-host=0.0.0.0"
      - "--hostname=${KEYCLOAK_HOSTNAME:-https://192.168.1.24:8443}"
      - "--hostname-strict=false"
      - "--hostname-backchannel-dynamic=false"
      - "--proxy-headers=xforwarded"
      - "--http-enabled=true"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../identity/keycloak/realm-dispensa.json:/opt/keycloak/data/import/realm-dispensa.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      # L'immagine ufficiale (ubi9-micro) non include curl/wget, quindi l'healthcheck non puo'
      # usarli (fallirebbe sempre con "not found", lasciando il container bloccato su
      # "unhealthy" per sempre). Usiamo il builtin /dev/tcp di bash, che e' presente.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    profiles: [core, family-local]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 384M

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: [storage]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-02-15T10-19-42Z
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-dispensa-media}
      OBJECT_STORAGE_EXPIRY_DAYS: ${OBJECT_STORAGE_EXPIRY_DAYS:-30}
    volumes:
      - ../storage/minio/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    depends_on:
      minio:
        condition: service_healthy
    profiles: [storage]
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otelcol-contrib/otel-collector.yml"]
    volumes:
      - ../observability/otel-collector/otel-collector.yml:/etc/otelcol-contrib/otel-collector.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    profiles: [observability-full]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  prometheus:
    image: prom/prometheus:v2.53.4
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-14d}",
        "--web.enable-lifecycle",
      ]
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    profiles: [observability-small, observability-full]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.1"
          memory: 128M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    depends_on:
      prometheus:
        condition: service_started
    profiles: [observability-small, observability-full]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    profiles: [observability-small, observability-full]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    profiles: [observability-full]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ../observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      - "4319:4317"
    profiles: [observability-full]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

networks:
  default:
    name: gestione-dispensa-family-local
    internal: false

volumes:
  postgres-data:
  redis-data:
  keycloak-data:
  minio-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  tempo-data:
