      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/dispensa/.well-known/openid-configuration
      OIDC_JWKS_URL: http://keycloak:8080/realms/dispensa/protocol/openid-connect/certs
      OFF_LOOKUP_BASE_URL: http://off-lookup:3200
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    profiles: [core, family-local]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3314/health/live"]
      start_period: 30s
      interval: 10s
      timeout: 3s
      retries: 5

  service-notifications:
    build:
      context: ../..
      dockerfile: services/service-notifications/Dockerfile
    environment:
      PORT: 3315
      DATABASE_URL: postgresql://dispensa_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/${POSTGRES_DB:-dispensa}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/dispensa/.well-known/openid-configuration
      OIDC_JWKS_URL: http://keycloak:8080/realms/dispensa/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    profiles: [core, family-local]
