services:
  service-identity:
    build:
      context: ../..
      dockerfile: services/service-identity/Dockerfile
    environment:
      PORT: 3310
      DATABASE_URL: postgresql://dispensa_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/${POSTGRES_DB:-dispensa}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/dispensa/.well-known/openid-configuration
      OIDC_JWKS_URL: http://keycloak:8080/realms/dispensa/protocol/openid-connect/certs
      # Admin API di Keycloak per la registrazione utenti: rete Docker interna, non l'issuer pubblico HTTPS.
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    profiles: [core, family-local]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3310/health/live"]
      start_period: 30s
      interval: 10s
      timeout: 3s
      retries: 5

  service-family:
    build:
      context: ../..
      dockerfile: services/service-family/Dockerfile
    environment:
      PORT: 3311
      DATABASE_URL: postgresql://dispensa_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/${POSTGRES_DB:-dispensa}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/dispensa/.well-known/openid-configuration
      OIDC_JWKS_URL: http://keycloak:8080/realms/dispensa/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    profiles: [core, family-local]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3311/health/live"]
      start_period: 30s
      interval: 10s
      timeout: 3s
      retries: 5

  service-inventory:
    build:
      context: ../..
      dockerfile: services/service-inventory/Dockerfile
    environment:
      PORT: 3312
      DATABASE_URL: postgresql://dispensa_app:${POSTGRES_APP_PASSWORD:-change-me-app-local-only}@postgres:5432/${POSTGRES_DB:-dispensa}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/dispensa/.well-known/openid-configuration
      OIDC_JWKS_URL: http://keycloak:8080/realms/dispensa/protocol/openid-connect/certs
      SHELF_LIFE_SERVICE_BASE_URL: http://service-shelf-life:3404/api/v1
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    profiles: [core, family-local]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3312/health/live"]
      start_period: 30s
      interval: 10s
      timeout: 3s
      retries: 5

  service-shopping:
