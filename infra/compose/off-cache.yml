# Open Food Facts lookup cache. See docs/ADR-0005-off-cache-datastore.md.
#
# Deliberately its OWN compose file with its OWN profile ("off-cache"), never bundled into
# `core`/`family-local`. This mirrors the rule in infra/compose/README.md: additional
# capabilities are explicit profiles, never hidden runtime dependencies of the core. Concretely:
#
#   - `docker compose up` (default profiles) never starts this service, and the api/
#     worker-integrations stack is fully functional without it -- barcode lookups just always go
#     to the live Open Food Facts API, exactly as before this cache existed;
#   - it is meant to hold a large, rebuildable dataset (the official Open Food Facts mongodump,
#     imported via: mongorestore --db off --collection products openfoodfacts-mongodbdump).
#     If the host doesn't have the disk/RAM to spare, simply never enable the `off-cache` profile;
#   - the primary consumer is off-lookup (services/off-lookup), which reads OFF_LOOKUP_MONGO_URL
#     to decide whether to connect. Every call is timeout + circuit-breaker protected, so a
#     stopped or missing mongo-off-cache degrades to API-only mode, never to a barcode outage;
#   - to activate: set OFF_LOOKUP_MONGO_URL=mongodb://mongo-off-cache:27017 in .env and run:
#       docker compose -f docker-compose.yml -f infra/compose/off-cache.yml \
#         --profile family-local --profile off-cache up -d
services:
  mongo-off-cache:
    image: mongo:7.0
    command: ["--wiredTigerCacheSizeGB", "${OFF_CACHE_MONGO_WIREDTIGER_CACHE_GB:-0.5}"]
    ports:
      - "${OFF_CACHE_MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-off-cache-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    profiles: [off-cache]
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - gestione-dispensa-family-local
    deploy:
      resources:
        limits:
          # Raise this (and OFF_CACHE_MONGO_WIREDTIGER_CACHE_GB) if the host has room; the
          # default is deliberately conservative for an old/small local machine. The cache
          # collection is the raw OFF dump (~84 GB BSON), so ensure adequate disk space.
          cpus: "1.0"
          memory: ${OFF_CACHE_MONGO_MEMORY_LIMIT:-1536M}
        reservations:
          cpus: "0.1"
          memory: 256M

volumes:
  mongo-off-cache-data:

networks:
  gestione-dispensa-family-local:
    external: true
    name: gestione-dispensa-family-local
