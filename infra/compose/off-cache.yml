# Open Food Facts lookup cache. See docs/ADR-0005-off-cache-datastore.md.
#
# Deliberately its OWN compose file with its OWN profile ("off-cache"), never bundled into
# `core`/`family-local`. This mirrors the rule in infra/compose/README.md: additional
# capabilities are explicit profiles, never hidden runtime dependencies of the core. Concretely:
#
#   - `docker compose up` (default profiles) never starts this service, and the api/
#     worker-integrations stack is fully functional without it -- barcode lookups just always go
#     to the live Open Food Facts API, exactly as before this cache existed;
#   - it is meant to hold a large, rebuildable dataset (a filtered projection of the Open Food
#     Facts mongodump, see ops/off-cache-import/README.md). If the host running Docker doesn't
#     have the disk/RAM to spare, simply never enable the `off-cache` profile;
#   - nothing else in the stack has a `depends_on` on this service. worker-integrations only
#     talks to it when OFF_CACHE_MONGO_URL is set (see services/worker-integrations/src/server.ts)
#     and every call is timeout + circuit-breaker protected, so a stopped or missing container
#     here degrades straight back to calling the API, never to an outage of barcode scanning.
services:
  mongo-off-cache:
    image: mongo:7.0
    command: ["--wiredTigerCacheSizeGB", "${OFF_CACHE_MONGO_WIREDTIGER_CACHE_GB:-0.5}"]
    ports:
      - "${OFF_CACHE_MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-off-cache-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    profiles: [off-cache]
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          # Raise this (and OFF_CACHE_MONGO_WIREDTIGER_CACHE_GB) if the host has room; the
          # default is deliberately conservative for an old/small local machine. The cache
          # collection is a lean projection (see ops/off-cache-import), not the raw ~84 GB dump,
          # so it stays workable well below this limit even on modest hardware.
          cpus: "1.0"
          memory: ${OFF_CACHE_MONGO_MEMORY_LIMIT:-1536M}
        reservations:
          cpus: "0.1"
          memory: 256M

volumes:
  mongo-off-cache-data:
