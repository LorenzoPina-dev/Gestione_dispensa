services:
  mkcert:
    image: alpine/mkcert
    entrypoint: ["/bin/sh", "-c"]
    environment:
      CAROOT: /certs
    volumes:
      - ./certs:/certs
    command:
      - |
        set -eu
        mkcert -install
        mkcert -key-file /certs/key.pem \
               -cert-file /certs/cert.pem \
               localhost 127.0.0.1 ::1 ${LAN_HOST:-192.168.1.24}
        echo "TLS certificate generated in ./certs/"
        ls -la /certs/
